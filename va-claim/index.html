<title>Claim Kit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a field-binder. Sticky tab strip, one working column, dashboard summary first.
   Color code: duty side = olive (things done through the unit, clinic or base),
   off-duty side = nursing blue (writing and uploading you can fit around school). */
:root{
  --bg:#f3f4f1; --surface:#ffffff; --surface-2:#e9ebe5; --line:#d3d7cc;
  --ink:#1d2320; --ink-2:#4e5850; --ink-3:#77817a;
  --accent:#8a6a1f; --accent-ink:#ffffff;
  --duty:#556b2f; --duty-bg:#e7edda; --duty-ink:#3c4d1f;
  --study:#1f6f9e; --study-bg:#dcecf6; --study-ink:#154f72;
  --good:#2f7d4f; --warn:#a86a00; --bad:#b23b2e; --warn-bg:#fbefd6; --bad-bg:#f8e1dd;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:6px;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#6250d6;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141815; --surface:#1c211d; --surface-2:#252b26; --line:#343c35;
  --ink:#e6e9e3; --ink-2:#b2bab2; --ink-3:#88918a;
  --accent:#d1a64a; --accent-ink:#1a1405;
  --duty:#9bb86a; --duty-bg:#26301b; --duty-ink:#bcd48f;
  --study:#6cb6e3; --study-bg:#16293a; --study-ink:#9fd0ef;
  --good:#6cc28f; --warn:#e3a640; --bad:#ef7d6f; --warn-bg:#33270f; --bad-bg:#3a1c18;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141815; --surface:#1c211d; --surface-2:#252b26; --line:#343c35;
  --ink:#e6e9e3; --ink-2:#b2bab2; --ink-3:#88918a;
  --accent:#d1a64a; --accent-ink:#1a1405;
  --duty:#9bb86a; --duty-bg:#26301b; --duty-ink:#bcd48f;
  --study:#6cb6e3; --study-bg:#16293a; --study-ink:#9fd0ef;
  --good:#6cc28f; --warn:#e3a640; --bad:#ef7d6f; --warn-bg:#33270f; --bad-bg:#3a1c18;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;margin:0}
.wrap{max-width:1440px;margin:0 auto;padding-inline:16px;padding-block:0 64px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0}
h1{font-size:2rem;line-height:1.05}
h2{font-size:1.5rem;line-height:1.1}
h3{font-size:1.15rem}
p{margin:0}
.mono{font-family:var(--f-mono);font-size:.85em}
.muted{color:var(--ink-2)}
.small{font-size:.85rem}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.grid2>*{min-width:0}

header.top{padding-block:20px 12px;display:flex;flex-wrap:wrap;gap:12px;align-items:end;justify-content:space-between}
.brand .eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.legend{display:flex;gap:8px;flex-wrap:wrap}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
nav.tabs button{font:600 .95rem var(--f-display);letter-spacing:.06em;text-transform:uppercase;background:none;border:0;color:var(--ink-2);padding:12px 10px 10px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs button:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
section.view{padding-top:20px}
section.view>.stack{gap:16px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.banner{border-radius:var(--r);padding:12px 14px;background:var(--warn-bg);color:var(--ink);border:1px solid var(--warn);display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.viz .asofl{stroke:var(--accent);stroke-width:2}.viz .evl.asof{stroke:var(--accent);stroke-dasharray:none;stroke-width:2}
.asof input[type=range]{width:100%;accent-color:var(--accent)}
.filebar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:12px 0 0;padding:8px 12px;border-radius:10px;background:var(--surface-2)}
.filebar.dirty{outline:1px solid var(--accent)}
.chip{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;font-size:.75rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:999px;white-space:nowrap}
.chip.duty{background:var(--duty-bg);color:var(--duty-ink)}
.chip.study{background:var(--study-bg);color:var(--study-ink)}
.chip.good{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.plain{background:var(--surface-2);color:var(--ink-2)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.dot.duty{background:var(--duty)}.dot.study{background:var(--study)}

button.btn{font:600 .9rem var(--f-body);padding:8px 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
button.btn:hover{border-color:var(--ink-3)}
button.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.btn.danger{color:var(--bad);border-color:var(--bad)}
button.btn.sm{padding:4px 10px;font-size:.8rem}
button.link{background:none;border:0;padding:0;color:var(--study);font:inherit;text-decoration:underline;cursor:pointer}

label.f{display:flex;flex-direction:column;gap:4px;font-size:.85rem;font-weight:600;color:var(--ink-2)}
label.f .hint{font-weight:400;color:var(--ink-3);font-size:.8rem}
input[type=text],input[type=date],input[type=email],input[type=tel],select,textarea{font:400 .95rem var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;width:100%}
textarea{min-height:76px;resize:vertical}
textarea.doc{font-family:var(--f-mono);font-size:.85rem;min-height:320px;line-height:1.55;background:var(--surface)}

/* Dashboard */
.dash-head{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
@media (max-width:560px){.dash-head{grid-template-columns:1fr;justify-items:start}}
.ring{width:132px;height:132px}
.ring text{font-family:var(--f-display);font-weight:700;fill:var(--ink)}
.timeline{position:relative;padding-top:6px}
.tl-bar{position:relative;height:10px;border-radius:5px;background:var(--surface-2);margin:34px 0 34px}
.tl-win{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--duty) 45%,transparent);border-radius:5px}
.tl-mark{position:absolute;top:-6px;width:2px;height:22px;background:var(--ink-3)}
.tl-mark.today{background:var(--accent);width:3px}
.tl-lab{position:absolute;font-size:.72rem;white-space:nowrap;transform:translateX(-50%);color:var(--ink-2);font-variant-numeric:tabular-nums}
.tl-lab.up{top:-30px}.tl-lab.down{top:18px}
.tl-lab b{color:var(--ink);font-weight:600}
.phase-row{display:grid;grid-template-columns:150px 1fr 48px;gap:10px;align-items:center;font-variant-numeric:tabular-nums}
@media (max-width:480px){.phase-row{grid-template-columns:110px 1fr 40px}}
.bar{height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden;display:flex}
.bar>span{display:block;height:100%}
.bar .d{background:var(--duty)}.bar .s{background:var(--study)}
.cond-table{width:100%;border-collapse:collapse;font-size:.88rem}
.cond-table th{text-align:left;font-weight:600;color:var(--ink-3);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;padding:6px 8px;border-bottom:1px solid var(--line)}
.cond-table td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
.cond-table td.c{text-align:center}
.tick{font-weight:700}
.tick.y{color:var(--good)}.tick.n{color:var(--ink-3)}
.scroll-x{overflow-x:auto}
.next li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.next li:last-child{border-bottom:0}
ul.clean{list-style:none;margin:0;padding:0}

/* Steps */
.task{display:grid;grid-template-columns:24px 1fr;gap:10px;padding:12px 12px 12px 10px;border-left:4px solid var(--line);background:var(--surface);border-radius:0 var(--r) var(--r) 0}
.task.duty{border-left-color:var(--duty)}.task.study{border-left-color:var(--study)}
.task input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent)}
.task.done .t-title{text-decoration:line-through;color:var(--ink-3)}
.t-title{font-weight:600}
.t-body{font-size:.88rem;color:var(--ink-2);margin-top:2px}
.t-meta{margin-top:6px}

/* Conditions */
.cond-card{border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.cond-card>summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.cond-card>summary::-webkit-details-marker{display:none}
.cond-card[open]>summary{border-bottom:1px solid var(--line)}
.cond-body{padding:14px;display:flex;flex-direction:column;gap:12px}
.meter{display:inline-flex;gap:2px}
.meter i{width:14px;height:6px;border-radius:2px;background:var(--surface-2)}
.meter i.on{background:var(--good)}

.doc-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.doc-pick{text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer;color:var(--ink);font:inherit;display:flex;flex-direction:column;gap:2px}
.doc-pick[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.doc-pick .form{font-family:var(--f-mono);font-size:.75rem;color:var(--accent)}
.doc-pick .nm{font-weight:600}
.doc-pick .st{font-size:.78rem;color:var(--ink-3)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:var(--r);font-weight:600;z-index:20}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px;border:1px solid var(--bad);border-radius:var(--r);background:var(--bad-bg)}
a{color:var(--study)}
.kv{display:grid;grid-template-columns:fit-content(55%) minmax(0,1fr);gap:4px 14px;font-size:.9rem}
.kv dt{color:var(--ink-3)}.kv dd{margin:0;font-variant-numeric:tabular-nums}
.calc-head{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px}
.calc-head .big{font-family:var(--f-display);font-weight:700;font-size:3rem;line-height:1;font-variant-numeric:tabular-nums}
.eyebrow-s{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.calc-row{display:grid;grid-template-columns:minmax(0,1fr) 120px 170px 36px;gap:8px;align-items:center;padding-block:6px;border-bottom:1px solid var(--line)}
.calc-row .why{grid-column:1/-1;margin:0}
.calc-row .nm{font-weight:600;min-width:0;overflow-wrap:anywhere}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}.seg .btn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pl-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:start;padding:8px 0 8px 10px;border-bottom:1px solid var(--line);border-left:4px solid var(--line)}
.pl-row.duty{border-left-color:var(--duty)}.pl-row.pers{border-left-color:var(--s4)}.pl-row.study{border-left-color:var(--study)}.pl-row .amt{font-variant-numeric:tabular-nums;font-weight:600}
details.panel>summary{cursor:pointer}
.panel-in{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface-2)}
.tgl{cursor:pointer}.tgl input{margin-top:4px;accent-color:var(--accent);width:18px;height:18px;flex:none}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.tile{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface-2)}
.tbig{font-family:var(--f-display);font-weight:700;font-size:1.8rem;line-height:1.1;font-variant-numeric:tabular-nums}
.warnbox{background:var(--warn-bg);border-left:4px solid var(--warn);padding:8px 10px;border-radius:6px}
.chart-wrap{position:relative}.viz{width:100%;height:auto;display:block;overflow:visible}
.viz .grid{stroke:var(--line);stroke-width:1}.viz .zero{stroke:var(--ink-3);stroke-width:1}.viz .axl{stroke:var(--ink-3)}
.viz .ax{fill:var(--ink-3);font:11px var(--f-mono)}.viz .lab{fill:var(--ink-2);font:12px var(--f-body)}
.viz .area{stroke:var(--surface);stroke-width:1.5;stroke-linejoin:round}.viz .ghost{fill:var(--line)}.viz .ln{fill:none;stroke-width:2;stroke-linejoin:round}
.viz .evl{stroke-width:1.5;stroke-dasharray:3 3;stroke:var(--ink-3)}.viz .evl.duty{stroke:var(--duty)}.viz .evl.study{stroke:var(--study)}
.viz .evc{fill:var(--accent);stroke:var(--surface);stroke-width:2}.viz .evc.duty{fill:var(--duty)}.viz .evc.study{fill:var(--study)}
.viz .evn{fill:#fff;font:600 10px var(--f-mono);pointer-events:none}.viz .hit{fill:transparent;cursor:crosshair}.viz .xh{stroke:var(--ink-2);stroke-width:1}
.viz [data-tip]{cursor:pointer}.viz .gapfill{fill:var(--s1);opacity:.15}
.tip{position:absolute;z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:.8rem;box-shadow:0 4px 14px rgba(0,0,0,.15);pointer-events:none;max-width:260px}
.tip .tr{display:grid;grid-template-columns:10px 1fr auto;gap:6px;align-items:center}.tip i{width:10px;height:10px;border-radius:3px;display:inline-block}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--ink-2)}.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.evs{list-style:none;padding:0;margin:0;display:grid;gap:8px}.ev{display:grid;grid-template-columns:24px 1fr;gap:10px;padding:8px 10px;border-left:4px solid var(--accent);background:var(--surface-2);border-radius:6px}
.ev.duty{border-left-color:var(--duty)}.ev.study{border-left-color:var(--study)}
.evb{width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font:600 11px var(--f-mono);display:grid;place-items:center}.ev.duty .evb{background:var(--duty)}.ev.study .evb{background:var(--study)}
.pl-row.off{opacity:.5}.pl-row.tot{border-left-color:var(--accent)}
.pos{color:var(--good)}.neg{color:var(--bad)}
.path-row{display:grid;grid-template-columns:minmax(0,9rem) minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 0}
.path-bar{position:relative;height:22px;background:var(--surface);border-radius:6px;overflow:hidden}
.path-bar .fill{position:absolute;inset:0 auto 0 0;border-radius:6px}.path-bar .fill.work{background:var(--study)}.path-bar .fill.ret{background:var(--duty)}
.path-bar .tick{position:absolute;top:-2px;bottom:-2px;width:3px;background:var(--ink);transform:translateX(-1px)}
.tbl-wrap{overflow-x:auto;max-height:520px;overflow-y:auto;border:1px solid var(--line);border-radius:8px}
.mtbl{border-collapse:collapse;width:100%;font-size:.85rem;font-variant-numeric:tabular-nums}
.mtbl th,.mtbl td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.mtbl th:first-child,.mtbl td:first-child{text-align:left;white-space:normal;min-width:9rem}
.mtbl thead th{position:sticky;top:0;background:var(--surface);font-weight:600}
.mtbl tr.yr td{font-weight:700;background:var(--surface)}
.yr-amt{font-weight:400}
.path-row .amt{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
@media (max-width:560px){.path-row{grid-template-columns:1fr auto}.path-row .path-bar{grid-column:1/-1;grid-row:2}}
@media (max-width:560px){.calc-row{grid-template-columns:1fr 1fr}.calc-row>:first-child{grid-column:1/-1}.calc-row>:last-child:empty{display:none}}
@media (prefers-reduced-motion:no-preference){.bar>span,.ring circle{transition:all .4s ease}}
.calgrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}@media (max-width:900px){.calgrid{grid-template-columns:1fr}}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.cw{font:600 .7rem var(--f-mono);text-transform:uppercase;color:var(--ink-3);text-align:center;padding:2px 0}
.cd{min-height:92px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:4px;display:flex;flex-direction:column;gap:2px;text-align:left;cursor:pointer;font:inherit;color:inherit;min-width:0;overflow:hidden}
.cd.off{border:0;background:transparent;cursor:default}.cd.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}.cd.sel{background:var(--surface-2);outline:2px solid var(--study)}
.cn{font:600 .8rem var(--f-mono);color:var(--ink-2)}.ci{font-size:.68rem;line-height:1.25;padding:1px 4px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci.dep{background:var(--duty-bg);color:var(--duty-ink);font-weight:700}.ci.bill{background:var(--warn-bg);color:var(--warn)}.ci.dl.study{background:var(--study-bg);color:var(--study-ink)}.ci.dl.duty{border:1px dashed var(--duty);color:var(--duty-ink)}.ci.more{color:var(--ink-3)}
@media (max-width:560px){.cd{min-height:58px}.ci{font-size:0;padding:0;height:6px;border-radius:3px}.ci.more{display:none}}
.dot.warnd{background:var(--warn)}
.rank{display:inline-grid;place-items:center;min-width:54px;height:54px;padding:0 8px;border-radius:12px;background:var(--duty);color:#fff;font:700 1rem var(--f-display);letter-spacing:.04em}.rank.big{min-width:76px;height:76px;font-size:1.3rem}
.rwdays{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}.rwday{height:28px;border-radius:6px;background:var(--surface-2);display:grid;place-items:center;font:600 .65rem var(--f-mono);color:var(--ink-3)}.rwday.half{background:var(--study-bg);color:var(--study-ink)}.rwday.on{background:var(--duty);color:#fff}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="eyebrow">VA claim, retirement and money · private workbook</div>
      <h1 id="appName">Claim Kit</h1>
    </div>
    <div class="legend small">
      <span class="chip duty"><span class="dot duty"></span>Duty side</span>
      <span class="chip study"><span class="dot study"></span>Off-duty / school side</span>
    </div>
  </header>
  <div id="fileBar"></div>
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <div id="exampleBanner"></div>
  <main id="main"></main>
</div>
<div id="toast" class="toast" hidden></div>

<script id="ckdata" type="application/json">null</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script>
(function(){
'use strict';
const SRC0='<!doctype html>\n'+document.documentElement.outerHTML; // this page as loaded, used to write a copy that carries your data
const KEY='claimkit.v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const DAY=86400000;

/* ---------- Steps (VA process as of 2026) ---------- */
const PHASES=[
 {id:'ready',name:'Get ready'},
 {id:'evidence',name:'Build evidence'},
 {id:'file',name:'File the claim'},

function load(){let loc=null;try{const raw=localStorage.getItem(KEY);if(raw)loc=JSON.parse(raw);}catch(e){}
  const emb=embedded(),pick=loc&&emb?((loc.savedAt||0)>=(emb.savedAt||0)?loc:emb):loc||emb;

const FILE={handle:null,savedAt:0,busy:false,timer:null};
function fileCopy(){const json=JSON.stringify(S).replace(/</g,'\\u003c');
  return SRC0.replace(/(<script id="ckdata" type="application\/json">)[\s\S]*?(<\/script>)/,(m,a,b)=>a+json+b);}
function idb(){return new Promise((ok,no)=>{try{const r=indexedDB.open('claimkit-file',1);r.onupgradeneeded=()=>r.result.createObjectStore('h');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error);}catch(e){no(e);}});}
async function idbGet(){try{const db=await idb();return await new Promise(ok=>{const q=db.transaction('h').objectStore('h').get('file');q.onsuccess=()=>ok(q.result||null);q.onerror=()=>ok(null);});}catch(e){return null;}}
async function idbPut(h){try{const db=await idb();db.transaction('h','readwrite').objectStore('h').put(h,'file');}catch(e){}}
async function writeFile(){if(!FILE.handle||FILE.busy)return false;FILE.busy=true;
  try{const w=await FILE.handle.createWritable();await w.write(fileCopy());await w.close();FILE.savedAt=S.savedAt;FILE.busy=false;renderFileBar();return true;}
  catch(e){FILE.busy=false;FILE.handle=null;renderFileBar();return false;}}
async function saveToFile(){ // Chrome and Edge can write straight into the file; Safari gets a fresh copy to replace the old one
  S.savedAt=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
  if(window.showSaveFilePicker){
    try{if(!FILE.handle){const old=await idbGet();if(old&&(await old.requestPermission({mode:'readwrite'}))==='granted')FILE.handle=old;}
      if(!FILE.handle){FILE.handle=await showSaveFilePicker({suggestedName:(S.appName||'Claim Kit')+'.html',types:[{description:'Claim Kit',accept:{'text/html':['.html']}}]});idbPut(FILE.handle);}
      if(await writeFile()){toast('Saved into the file');return;}}
    catch(e){if(e&&e.name==='AbortError')return;}}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([fileCopy()],{type:'text/html'}));a.download=(S.appName||'Claim Kit')+'.html';document.body.appendChild(a);a.click();a.remove();
  FILE.savedAt=S.savedAt;renderFileBar();toast('Saved a new copy to Downloads');}

  $('#saveFile').onclick=saveToFile;}

/* ---------- Dates ---------- */
function parseDate(s){if(!s)return null;const d=new Date(s+'T12:00:00');return isNaN(d)?null:d;}
function fmt(d){return d?d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}):'';}
function bdd(){
  const sep=parseDate(S.profile.sep);const now=new Date();now.setHours(12,0,0,0);
  if(!sep)return{state:'nodate'};
  const open=new Date(sep-180*DAY),close=new Date(sep-90*DAY);
  const daysToOpen=Math.ceil((open-now)/DAY),daysToClose=Math.ceil((close-now)/DAY),daysToSep=Math.ceil((sep-now)/DAY);
  let state;
  if(daysToSep<0)state=(now-sep)/DAY<=365?'after1y':'afterlong';
  else if(daysToOpen>0)state='before';else if(daysToClose>=0)state='open';else state='closed';
  return{state,sep,open,close,now,daysToOpen,daysToClose,daysToSep,anniversary:new Date(sep.getTime()+365*DAY)};
}

/* ---------- Condition readiness ---------- */
const READY=[
 ['Details',c=>!!(c.event&&c.symptoms&&c.frequency&&c.daily)],
 ['In-service record',c=>!!c.str],
 ['Diagnosis',c=>!!c.diagnosed],
 ['Link to service',c=>c.cause==='presumptive'||c.nexus==='not needed'||c.nexus==='have'],
 ['Buddy statement',c=>S.witnesses.some(w=>(w.conds||[]).includes(c.id)&&w.status==='received')||c.noBuddy]
];
function condScore(c){return READY.filter(([,f])=>f(c)).length;}
function progress(){
  const tasksDone=TASKS.filter(t=>S.tasks[t.id]).length;
  const condPts=S.conditions.reduce((a,c)=>a+condScore(c),0),condMax=S.conditions.length*READY.length;
  const pct=Math.round(100*(tasksDone+condPts)/(TASKS.length+condMax||1));
  return{pct,tasksDone,condPts,condMax};
}

  if(opts.type==='select')return `<label class="f">${label}${hint}<select id="${id}" data-k="${opts.k||''}">${opts.options.map(([v,n])=>`<option value="${esc(v)}" ${v===val?'selected':''}>${esc(n)}</option>`).join('')}</select></label>`;
  return `<label class="f">${label}${hint}<input type="${opts.type||'text'}" id="${id}" data-k="${opts.k||''}" value="${esc(val)}"></label>`;
}

  return `<div class="stack"><div class="panel stack"><h2>About me</h2><p class="small muted">VA.gov fills your contact details and service history from your record, so this is only what the documents need. Do not enter your SSN here.</p>
  <div class="grid2">
   ${field('p-name','Full name',P.name,{k:'name'})}
   ${field('p-branch','Branch',P.branch,{k:'branch',type:'select',options:[['',''],['Army','Army'],['Navy','Navy'],['Air Force','Air Force'],['Marine Corps','Marine Corps'],['Coast Guard','Coast Guard'],['Space Force','Space Force']]})}
   ${field('p-comp','Component',P.component,{k:'component',type:'select',options:[['',''],['Active duty','Active duty'],['Reserve','Reserve'],['National Guard','National Guard']]})}
   ${field('p-rank','Rank',P.rank,{k:'rank'})}
   ${field('p-mos','Job (MOS / rating / AFSC)',P.mos,{k:'mos'})}
   ${field('p-entry','Service start date',P.entry,{k:'entry',type:'date'})}
   ${field('p-sep','Separation date',P.sep,{k:'sep',type:'date',hint:'Expected date if still serving'})}
   ${field('p-septype','Type of separation',P.sepType,{k:'sepType',type:'select',options:[['',''],['ETS','ETS / end of contract'],['Retirement','Retirement'],['Medical','Medical (IDES)'],['Other','Other']]})}
   ${field('p-phone','Phone (for buddy and provider letters)',P.phone,{k:'phone',type:'tel'})}
   ${field('p-email','Email (for letters)',P.email,{k:'email',type:'email'})}
  </div>${P.sepType==='Medical'?'<p class="banner small">In IDES (medical separation) VA rates you through the military process, and BDD does not apply. Ask your PEBLO and MSC about adding conditions.</p>':''}</div></div>`;
}
function bindMe(){document.querySelectorAll('[data-k]').forEach(el=>el.addEventListener(el.tagName==='SELECT'?'change':'input',()=>{S.profile[el.dataset.k]=el.value;save();if(el.dataset.k==='sepType')render();}));}

function vConds(){
  const opts={cause:[['direct','Started or happened during service'],['secondary','Caused or worsened by another service-connected condition'],['aggravated','Existed before service and service made it worse'],['presumptive','Presumptive (for example PACT Act or Gulf War)']],
    nexus:[['not needed','Not needed: it is clearly in my STRs'],['maybe','Not sure yet'],['need','Need a medical opinion'],['asked','Asked a provider'],['have','Have a medical opinion']]};
  const cards=S.conditions.map(c=>{
    const sc=condScore(c);
    return `<details class="cond-card" ${S.openCond===c.id?'open':''} data-cid="${c.id}"><summary><span class="row"><b>${esc(c.name||'Untitled condition')}</b><span class="chip ${c.kind==='mental'?'study':'plain'}">${c.kind==='mental'?'Mental health':'Physical'}</span></span><span class="row small muted"><span class="meter" aria-label="${sc} of ${READY.length}">${READY.map((_,i)=>`<i class="${i<sc?'on':''}"></i>`).join('')}</span>${sc}/${READY.length}</span></summary>
    <div class="cond-body">
     <div class="grid2">
      ${field('c-name-'+c.id,'Condition name',c.name,{k:'name',hint:'Use the plain name, like "lower back pain" or "tinnitus"'})}
      ${field('c-kind-'+c.id,'Type',c.kind,{k:'kind',type:'select',options:[['physical','Physical'],['mental','Mental health']]})}
      ${field('c-cause-'+c.id,'How is it connected to service?',c.cause,{k:'cause',type:'select',options:opts.cause})}
      ${c.cause==='secondary'?field('c-sec-'+c.id,'Caused by which condition?',c.secondaryTo,{k:'secondaryTo'}):''}
      ${field('c-onset-'+c.id,'When did it start?',c.onset,{k:'onset',hint:'Month and year is fine'})}
     </div>
     ${field('c-event-'+c.id,'What happened in service?',c.event,{k:'event',type:'textarea',hint:'The injury, event, duty or exposure, with where and when'})}
     <div class="grid2">
      ${field('c-sym-'+c.id,'Symptoms now',c.symptoms,{k:'symptoms',type:'textarea'})}
      ${field('c-freq-'+c.id,'How often',c.frequency,{k:'frequency',type:'textarea'})}
      ${field('c-worst-'+c.id,'On your worst days',c.worst,{k:'worst',type:'textarea',hint:'VA rates on how bad it gets, so be specific'})}
      ${field('c-flare-'+c.id,'Flare-ups',c.flare,{k:'flare',type:'textarea',hint:'How often and how long'})}
      ${field('c-work-'+c.id,'Effect on work or duty',c.work,{k:'work',type:'textarea'})}
      ${field('c-daily-'+c.id,'Effect on daily life and school',c.daily,{k:'daily',type:'textarea'})}
      ${field('c-tx-'+c.id,'Treatment so far',c.treatment,{k:'treatment',type:'textarea'})}
      ${field('c-meds-'+c.id,'Medications',c.meds,{k:'meds',type:'textarea'})}
     </div>
     <h3>Evidence</h3>
     <div class="grid2">
      ${field('c-str-'+c.id,'Where it shows in your records',c.str,{k:'str',type:'textarea',hint:'Sick call dates, profiles, LOD, audiograms'})}
      <div class="stack" style="gap:8px">
       <label class="row small"><input type="checkbox" id="c-dx-${c.id}" data-k="diagnosed" ${c.diagnosed?'checked':''}> I have a current diagnosis</label>
       ${field('c-dxn-'+c.id,'Diagnosis and where it is written',c.diagnosis,{k:'diagnosis'})}
       ${field('c-nexus-'+c.id,'Medical opinion linking it to service',c.nexus||'maybe',{k:'nexus',type:'select',options:opts.nexus})}
       <label class="row small"><input type="checkbox" id="c-nobuddy-${c.id}" data-k="noBuddy" ${c.noBuddy?'checked':''}> No buddy statement needed for this one</label>
      </div>
     </div>
     ${c.kind==='mental'?`<h3>Traumatic event details (for VA Form 21-0781)</h3><p class="small muted">Only if the condition is tied to an event. Leave blank for conditions that built up over time.</p><div class="grid2">
      ${field('c-evd-'+c.id,'Approximate date',(c.ev||{}).date,{k:'ev.date'})}
      ${field('c-evp-'+c.id,'Location',(c.ev||{}).place,{k:'ev.place'})}
      ${field('c-evu-'+c.id,'Unit at the time',(c.ev||{}).unit,{k:'ev.unit'})}
      ${field('c-evw-'+c.id,'What happened',(c.ev||{}).what,{k:'ev.what',type:'textarea'})}
      ${field('c-evc-'+c.id,'Changes others may have noticed afterward',(c.ev||{}).changes,{k:'ev.changes',type:'textarea',hint:'Requests for transfer, conduct changes, sick visits, relationship or sleep changes'})}
      ${field('c-evr-'+c.id,'Who you told, and when',(c.ev||{}).reported,{k:'ev.reported',type:'textarea'})}
     </div>`:''}
     <div class="row"><button class="btn sm" data-doc-for="stmt:${c.id}">Open personal statement</button><button class="btn sm" data-doc-for="cp:${c.id}">Open C&amp;P prep</button><span style="flex:1"></span><span data-delwrap="${c.id}"><button class="btn sm danger" data-del="${c.id}">Remove</button></span></div>
    </div></details>`;}).join('');
  return `<div class="stack"><div class="row" style="justify-content:space-between"><h2>Conditions</h2><button class="btn primary" id="addCond">Add a condition</button></div>
   ${S.conditions.length?cards:'<div class="panel muted">Add each condition you want to claim. Go head to toe: hearing, head, neck, back, joints, sleep, mood, skin, stomach, breathing.</div>'}</div>`;
}
function setPath(o,k,v){const ks=k.split('.');let t=o;while(ks.length>1){const p=ks.shift();t[p]=t[p]||{};t=t[p];}t[ks[0]]=v;}
function bindConds(){
  $('#addCond').onclick=()=>{const c={id:uid(),name:'',kind:'physical',cause:'direct',nexus:'maybe'};S.conditions.push(c);S.openCond=c.id;save();render();const el=$('#c-name-'+c.id);el&&el.focus();};
  document.querySelectorAll('.cond-card').forEach(card=>{
    const c=S.conditions.find(x=>x.id===card.dataset.cid);
    card.addEventListener('toggle',()=>{if(card.open)S.openCond=c.id;});
    card.querySelectorAll('[data-k]').forEach(el=>{
      const ev=el.type==='checkbox'||el.tagName==='SELECT'?'change':'input';
      el.addEventListener(ev,()=>{setPath(c,el.dataset.k,el.type==='checkbox'?el.checked:el.value);save();if(['kind','cause','diagnosed','nexus','noBuddy'].includes(el.dataset.k))render();else if(el.dataset.k==='name')card.querySelector('summary b').textContent=el.value||'Untitled condition';});
    });
  });
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const id=b.dataset.del,w=document.querySelector(`[data-delwrap="${id}"]`);w.innerHTML=`<span class="confirm small">Remove this condition? <button class="btn sm danger" data-del-yes="${id}">Remove</button><button class="btn sm" data-del-no>Keep</button></span>`;
    w.querySelector('[data-del-yes]').onclick=()=>{S.conditions=S.conditions.filter(c=>c.id!==id);save();render();toast('Condition removed');};w.querySelector('[data-del-no]').onclick=()=>render();});
  document.querySelectorAll('[data-doc-for]').forEach(b=>b.onclick=()=>{const [id,ref]=b.dataset.docFor.split(':');S.docSel={id,ref};go('docs');});
}

function vWits(){
  const rows=S.witnesses.map(w=>`<div class="panel stack" data-wid="${w.id}">
    <div class="grid2">${field('w-name-'+w.id,'Name',w.name,{k:'name'})}${field('w-rel-'+w.id,'How they know you',w.relation,{k:'relation',hint:'Squad leader, roommate, spouse'})}
    ${field('w-contact-'+w.id,'Contact',w.contact,{k:'contact'})}${field('w-status-'+w.id,'Status',w.status,{k:'status',type:'select',options:[['not asked','Not asked yet'],['asked','Asked'],['received','Statement received']]})}</div>
    ${field('w-saw-'+w.id,'What they saw',w.saw,{k:'saw',type:'textarea',hint:'The event, or symptoms and changes they noticed'})}
    <div class="stack" style="gap:4px"><span class="small muted" style="font-weight:600">Conditions they can speak to</span><div class="row">${S.conditions.map(c=>`<label class="row small"><input type="checkbox" id="w-c-${w.id}-${c.id}" data-wc="${c.id}" ${(w.conds||[]).includes(c.id)?'checked':''}> ${esc(c.name||'Untitled')}</label>`).join('')||'<span class="small muted">Add conditions first.</span>'}</div></div>
    <div class="row"><button class="btn sm" data-doc-for="buddyask:${w.id}">Open request message</button><button class="btn sm" data-doc-for="buddy:${w.id}">Open starter draft</button><span style="flex:1"></span><span data-wdelwrap="${w.id}"><button class="btn sm danger" data-wdel="${w.id}">Remove</button></span></div>
  </div>`).join('');
  return `<div class="stack"><div class="row" style="justify-content:space-between"><h2>Witnesses</h2><button class="btn primary" id="addWit">Add a person</button></div><p class="muted">Buddy statements (VA Form 21-10210) back up what is missing from your records. The writer fills in the form themselves; you give them a starting point.</p>${rows||'<div class="panel muted">No one added yet.</div>'}</div>`;
}
function bindWits(){
  $('#addWit').onclick=()=>{S.witnesses.push({id:uid(),name:'',relation:'',contact:'',saw:'',conds:[],status:'not asked'});save();render();};
  document.querySelectorAll('[data-wid]').forEach(p=>{const w=S.witnesses.find(x=>x.id===p.dataset.wid);
    p.querySelectorAll('[data-k]').forEach(el=>el.addEventListener(el.tagName==='SELECT'?'change':'input',()=>{w[el.dataset.k]=el.value;save();}));
    p.querySelectorAll('[data-wc]').forEach(el=>el.onchange=()=>{w.conds=w.conds||[];if(el.checked)w.conds.push(el.dataset.wc);else w.conds=w.conds.filter(x=>x!==el.dataset.wc);save();});});
  document.querySelectorAll('[data-wdel]').forEach(b=>b.onclick=()=>{const id=b.dataset.wdel,wr=document.querySelector(`[data-wdelwrap="${id}"]`);wr.innerHTML=`<span class="confirm small">Remove? <button class="btn sm danger" data-y>Remove</button><button class="btn sm" data-n>Keep</button></span>`;wr.querySelector('[data-y]').onclick=()=>{S.witnesses=S.witnesses.filter(w=>w.id!==id);save();render();};wr.querySelector('[data-n]').onclick=()=>render();});
  document.querySelectorAll('[data-doc-for]').forEach(b=>b.onclick=()=>{const [id,ref]=b.dataset.docFor.split(':');S.docSel={id,ref};go('docs');});
}

function vExpo(){
  const E=S.exposure,yn=[['',''],['yes','Yes'],['no','No'],['unsure','Not sure']];
  return `<div class="stack"><div class="panel stack"><h2>Toxic exposure</h2><p class="small muted">The 21-526EZ asks these questions. Under the PACT Act some conditions are presumed to be caused by service if you served in certain places, so you do not need a medical opinion for them.</p>
  <div class="grid2">
   ${field('x-gulf','Served in the Gulf War area or Southwest Asia, Afghanistan, and nearby on or after Aug 2, 1990?',E.gulf,{k:'gulf',type:'select',options:yn})}
   ${field('x-gulfwhere','Where and when',E.gulfWhere,{k:'gulfWhere',type:'textarea'})}
   ${field('x-burn','Exposed to burn pits or other airborne hazards?',E.burnpit,{k:'burnpit',type:'select',options:yn})}

function bindExpo(){document.querySelectorAll('[data-k]').forEach(el=>el.addEventListener(el.tagName==='SELECT'?'change':'input',()=>{S.exposure[el.dataset.k]=el.value;save();}));}

/* ---------- Document generators ---------- */
const P=()=>S.profile;
const or=(v,ph)=>v&&String(v).trim()?String(v).trim():`[${ph}]`;
const sentence=s=>{s=String(s||'').trim();if(!s)return '';return /[.!?]$/.test(s)?s:s+'.';};
function causeLine(c){
  switch(c.cause){
   case 'secondary':return `This condition is secondary to my ${or(c.secondaryTo,'other service-connected condition')}.`;
   case 'aggravated':return 'This condition existed before my service and was made worse by my service.';
   case 'presumptive':return 'I believe this condition is presumptive based on where I served.';
   default:return 'This condition started during my military service.';
  }
}
function serviceIntro(){const p=P();return `My name is ${or(p.name,'full name')}. I served in the ${or(p.branch,'branch')} (${or(p.component,'component')}) as a ${or(p.rank,'rank')}, ${or(p.mos,'job')}, from ${or(fmt(parseDate(p.entry)),'start date')}${p.sep?` to ${fmt(parseDate(p.sep))}`:''}.`;}
const certify='I certify that the statements above are true and correct to the best of my knowledge and belief.';
function genStmt(c){
  const lines=[`STATEMENT IN SUPPORT OF CLAIM (VA Form 21-4138)`,`Condition: ${or(c.name,'condition')}`,'',
   `${serviceIntro()} I am submitting this statement in support of my claim for ${or(c.name,'condition')}.`,'',
   `How it started`,`${causeLine(c)} ${sentence(c.event)}${c.onset?` This was around ${c.onset}.`:''}`.trim(),'',
   `My symptoms`,`${sentence(or(c.symptoms,'symptoms'))} ${c.frequency?'This happens '+sentence(c.frequency.charAt(0).toLowerCase()+c.frequency.slice(1)):''}`.trim()];
  if(c.worst)lines.push('',`On my worst days`,sentence(c.worst));
  if(c.flare)lines.push('',`Flare-ups`,sentence(c.flare));
  if(c.work||c.daily){lines.push('',`How it affects my life`);if(c.work)lines.push(`At work: ${sentence(c.work)}`);if(c.daily)lines.push(`Daily life: ${sentence(c.daily)}`);}
  if(c.treatment||c.meds){lines.push('',`Treatment`);if(c.treatment)lines.push(sentence(c.treatment));if(c.meds)lines.push(`Medications: ${sentence(c.meds)}`);}
  if(c.str)lines.push('',`Records`,`This is documented in my records: ${sentence(c.str)}`);
  lines.push('',certify,'',`${or(P().name,'name')}`,`Date: ____________`);
  return lines.join('\n');
}
function genCP(c){
  return [`C&P EXAM PREP: ${or(c.name,'condition').toUpperCase()}`,'',
  'Bring: ID, a list of medications, this sheet. Arrive early.','',
  'Key points to say in your own words',
  `- When it started: ${or(c.onset,'when')}. ${sentence(c.event)}`,
  `- What it feels like now: ${sentence(or(c.symptoms,'symptoms'))}`,
  `- How often: ${sentence(or(c.frequency,'frequency'))}`,
  `- Worst days: ${sentence(or(c.worst,'describe your worst days'))}`,
  `- Flare-ups: ${sentence(or(c.flare,'how often, how long, what you can not do during one'))}`,
  `- Work and duty: ${sentence(or(c.work,'effect on work'))}`,
  `- Daily life and school: ${sentence(or(c.daily,'effect on daily life'))}`,
  `- Treatment and meds: ${sentence(or([c.treatment,c.meds].filter(Boolean).join('; '),'treatment'))}`,'',
  'Reminders',
  '- Describe a bad day, not a good day. The exam is a snapshot.',
  '- For joints and back: say out loud when pain starts during each movement, and stop there. Mention if repeated use or flare-ups reduce your motion.',
  '- Do not push through pain to look tough, and do not exaggerate.',
  '- Mention every symptom, even ones that seem unrelated.',
  c.kind==='mental'?'- Mental health: describe frequency of symptoms, sleep, relationships, work and school impact, and any panic, memory or concentration problems.':'- Bring any brace, cane or device you actually use.',
  '- Afterward, write down how long the exam lasted and what was examined.'].join('\n');
}
function genNexus(c){const p=P();
  return [`Dear Dr. ____________,`,'',
  `I am filing a VA disability claim for ${or(c.name,'condition')} and am asking whether you would be willing to write a medical opinion about it. You have treated me for this condition${c.diagnosis?` (${c.diagnosis})`:''}.`,'',
  `Background: ${causeLine(c)} ${sentence(c.event)}${c.str?` It is recorded in my service treatment records: ${sentence(c.str)}`:''}`,'',
  'If, after reviewing my records, you agree, VA looks for:',
  `1. The current diagnosis.`,
  `2. Your opinion of whether it is "at least as likely as not" (50 percent or greater probability) that my ${or(c.name,'condition')} ${c.cause==='secondary'?`was caused or aggravated by my ${or(c.secondaryTo,'service-connected condition')}`:c.cause==='aggravated'?'was aggravated beyond its natural progression by my military service':'was incurred in or caused by my military service'}.`,
  '3. The reasons for your opinion (the medical rationale), and the records you reviewed.',
  '4. Your signature, credentials and date, on letterhead.','',
  'I can provide copies of my service treatment records. I am only asking for your honest medical opinion. VA also has Disability Benefits Questionnaires (DBQs) you can fill in if you prefer.','',
  'Thank you for your time.','',or(p.name,'name'),p.phone||'',p.email||''].filter((l,i,a)=>!(l===''&&a[i-1]==='')).join('\n');
}
function witConds(w){return S.conditions.filter(c=>(w.conds||[]).includes(c.id));}
function genBuddyAsk(w){const p=P(),cs=witConds(w).map(c=>c.name).join(' and ')||'[condition]';
  return [`Hi ${or(w.name,'name').split(' ')[0]},`,'',
  `I'm filing my VA disability claim and would be grateful for a short statement from you about my ${cs}. You were there: ${sentence(or(w.saw,'what they saw'))}`,'',
  'It goes on VA Form 21-10210 (Lay/Witness Statement), which you can fill out online at va.gov/supporting-forms-for-claims/lay-witness-statement-form-21-10210 or on paper. Just describe what you personally saw or know, in your own words, with dates and places if you remember them. It does not need to be long.','',
  'I put a starter draft below that you can change however you like. Please only include what is true for you.','',
  'Thanks,',or(p.name,'name')].join('\n');
}
function genBuddy(w){const p=P();const cs=witConds(w);
  return [`LAY/WITNESS STATEMENT (VA Form 21-10210), starter draft for ${or(w.name,'witness')}`,'',
  `My name is ${or(w.name,'name')}. I know ${or(p.name,'veteran')} as their ${or(w.relation,'relationship').toLowerCase()}.`,'',
  ...cs.map(c=>`About their ${c.name}: ${sentence(or(w.saw,'what I saw'))}${c.onset?` This was around ${c.onset}.`:''} [Add what you noticed afterward: changes in how they worked, moved, slept, or acted.]`),
  cs.length?'':'[Describe what you saw, with dates and places.]','',
  'I certify that the statements above are true and correct to the best of my knowledge and belief.','',
  '[Signature and date]'].join('\n');
}
function gen0781(c){const e=c.ev||{};
  return [`VA FORM 21-0781 WORKSHEET: ${or(c.name,'condition')}`,
  'Use these details when you complete the 21-0781 section on VA.gov or the PDF.','',
  `Traumatic event`,`- Approximate date: ${or(e.date,'month and year')}`,`- Location: ${or(e.place,'location')}`,`- Unit: ${or(e.unit,'unit')}`,`- What happened: ${sentence(or(e.what,'describe the event'))}`,'',
  `Behavioral changes after the event (VA can use these as evidence)`,`- ${sentence(or(e.changes,'list changes'))}`,'',
  `Who knew`,`- ${sentence(or(e.reported,'who you told and when'))}`,'',
  `Treatment`,`- ${sentence(or(c.treatment,'treatment'))}${c.meds?' Medications: '+sentence(c.meds):''}`,'',
  'Notes',
  '- For events involving military sexual trauma, evidence like requests for transfer, changes in performance, or visits to a chaplain or clinic count, even without a report.',
  '- You can skip anything you are not comfortable writing. A VSO or the VA MST coordinator can help.',
  '- Veterans Crisis Line: dial 988 then press 1, or text 838255.'].join('\n');
}
function gen526(){
  const p=P(),E=S.exposure,lines=['VA FORM 21-526EZ ANSWERS (paste into VA.gov)',`Prepared ${fmt(new Date())}`,''];
  lines.push('STEP: Veteran details','- VA.gov prefills your name, contact details and service periods. Check them against:',`  Branch: ${or(p.branch,'branch')} (${or(p.component,'component')})`,`  Service: ${or(fmt(parseDate(p.entry)),'start')} to ${or(fmt(parseDate(p.sep)),'separation date')}`,...(p.periods&&p.periods.length?['  Service periods and federal orders (from your records):',...p.periods.map(x=>'   - '+x)]:[]),'');
  lines.push('STEP: Conditions');
  if(!S.conditions.length)lines.push('- [Add conditions in the app]');
  S.conditions.forEach((c,i)=>{
    lines.push(`${i+1}. ${or(c.name,'condition')}`);
    const t={direct:'A new condition I got during service (or caused by service)',secondary:'Caused by another service-connected condition',aggravated:'Existed before service and got worse',presumptive:'A new condition I got during service (VA may treat it as presumptive)'}[c.cause||'direct'];
    lines.push(`   What caused it: ${t}`);
    if(c.cause==='secondary')lines.push(`   Caused by: ${or(c.secondaryTo,'condition')}`);
    lines.push(`   Describe the injury, event or exposure: ${sentence(or(c.event,'what happened'))}`);
    lines.push(`   When: ${or(c.onset,'approximate date')}`);
    lines.push('');
  });
  lines.push('STEP: Mental health statement');
  const mh=S.conditions.filter(c=>c.kind==='mental');
  lines.push(mh.length?`- Claiming: ${mh.map(c=>c.name).join(', ')}. Use the 21-0781 worksheet for the event questions.`:'- Not claiming a mental health condition.','');
  lines.push('STEP: Toxic exposure');
  const ynt=v=>({yes:'Yes',no:'No',unsure:'Not sure'})[v]||'[answer]';
  lines.push(`- Gulf War / Southwest Asia / Afghanistan service: ${ynt(E.gulf)}${E.gulfWhere?` (${E.gulfWhere})`:''}`,`- Burn pits or airborne hazards: ${ynt(E.burnpit)}${E.hazards?` (${E.hazards})`:''}`,`- Agent Orange locations: ${ynt(E.agentOrange)}`,`- Other exposures: ${E.other||'None listed'}`,'');
  lines.push('STEP: Supporting evidence','- Service treatment records: VA requests them for online claims. Upload your own copy if you have it.','- Upload: personal statement for each condition (21-4138)');
  const got=S.witnesses.filter(w=>w.status==='received');
  lines.push(`- Upload: buddy statements (21-10210)${got.length?': '+got.map(w=>w.name).join(', '):''}`);
  const nx=S.conditions.filter(c=>c.nexus==='have');
  if(nx.length)lines.push(`- Upload: medical opinions for ${nx.map(c=>c.name).join(', ')}`);
  lines.push('- Private medical records, or authorize VA to get them with 21-4142/4142a','');

const DATE_RE=/\b(\d{1,2}\/\d{1,2}\/(?:19|20)\d{2}|(?:19|20)\d{2}-\d{2}-\d{2}|\d{1,2} (?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]* (?:19|20)\d{2}|(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]* \d{1,2},? (?:19|20)\d{2})\b/gi;

function normDate(s){const d=new Date(s.replace(/-/g,'/'));return isNaN(d)?null:d;}
function scanText(text,file,out){
  text=text.replace(/\s+/g," ");
  const dates=[];let m;DATE_RE.lastIndex=0;while((m=DATE_RE.exec(text)))dates.push({i:m.index,s:m[1]});
  for(const t of SCAN_TERMS){t.re.lastIndex=0;
    while((m=t.re.exec(text))){
      const i=m.index,before=text.slice(Math.max(0,i-30),i);
      let near=null;for(const d of dates){if(d.i<=i&&i-d.i<1500)near=d;if(d.i>i)break;}
      const r=out[t.name]||(out[t.name]={term:t,hits:[],files:new Set(),dates:[]});
      r.files.add(file);const neg=NEG_RE.test(before);
      if(near&&!neg){const nd=normDate(near.s);if(nd)r.dates.push(nd);}
      r.hits.push({file,neg,date:near?near.s:'',snip:text.slice(Math.max(0,i-90),i+m[0].length+90).replace(/\s+/g,' ').trim(),word:m[0]});
    }
  }
}
async function readFile(f){
  if(/\.pdf$/i.test(f.name)||f.type==='application/pdf'){
    if(!window.pdfjsLib)throw new Error('The PDF reader did not load. Check your connection and reload the page.');
    const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise;let txt='';
    for(let p=1;p<=pdf.numPages;p++){const c=await (await pdf.getPage(p)).getTextContent();txt+=c.items.map(it=>it.str+(it.hasEOL?'\n':' ')).join('')+'\n';
      SCAN.msg=`Reading ${f.name}: page ${p} of ${pdf.numPages}`;const el=$('#scanMsg');if(el)el.textContent=SCAN.msg;}
    return txt;
  }
  return await f.text();
}

  SCAN.busy=true;SCAN.results=null;const out={},notes=[];render();
  for(const f of files){try{const txt=await readFile(f);if(txt.replace(/\s/g,'').length<50)notes.push(`${f.name} has no readable text. It is probably a scanned image; type key details in by hand or ask Claude to read it.`);scanText(txt,f.name,out);}catch(e){notes.push(`${f.name}: ${e.message||'could not be read'}`);}}

function combine(list){ // VA "whole person" method; returns unrounded combined value

function monthlyPay(r,D){

/* ---------- Savings and taxes: emergency fund, TSP, and a yearly tax estimate ---------- */
function svState(){S.sv=Object.assign({cash:'',tsp:'',tspMo:'',months:'3',hist:[]},S.sv||{});return S.sv;}
function taxYear(R,y){ // income and tax for calendar year y, month by month from the same switches as the Calculator
  const P=S.plan,O=P.options[planView().date]||P.options[Object.keys(P.options)[0]],agr=P.agrWages||Math.round(O.high3*12),cache={};
  let wages=0,ret=0,sal=0,ss=0,va=0,agrM=0,jobs=new Set();
  for(let m=0;m<12;m++){const i=y*12+m,L=lifeAt(i);
    if(L.agr){wages+=agr/12*L.infl;agrM++;jobs.add('AGR');continue;}
    const k=[L.job,L.stage,L.sal,Math.round(L.cola*200)].join(),X=cache[k]??=planResult(R,{job:L.job,stage:L.stage,sal:L.sal,yrs:L.yrs,cola:L.cola});
    ret+=X.ret;va+=X.va;jobs.add(L.stage==='retired'?'Fully retired':'Retired pay + '+L.label.replace(/, year.*/,'')+(planView().emp==='va'?' at the VA':''));
    const s=X.L.find(l=>l.side==='study'),q=X.L.find(l=>/^Social Security/.test(l.k));if(s)sal+=s.v;if(q)ss+=q.v;}
  const f=Math.pow(1+INFL,Math.max(0,y-2026)),age=y-+P.born.slice(0,4),std=TAX.fedStd+(age>=65?TAX.fed65:0);
  const fedInc=wages+ret+sal+ss*.85,fed=bracketTax(Math.max(0,fedInc/f-std),TAX.fed)*f;
  const mn=bracketTax(Math.max(0,sal/f-TAX.mnStd),TAX.mn)*f; // AGR pay: Minnesota's active-duty military pay subtraction; retired pay, VA pay and (under the limit) Social Security are not taxed
  const fica=(Math.min(wages+sal,TAX.ssBase*f)*.062+(wages+sal)*.0145);
  const fedSalOnly=bracketTax(Math.max(0,(sal+wages)/f-std),TAX.fed)*f; // roughly what a job's withholding covers if it is your only income
  return{y,wages,ret,sal,ss,va,agrM,fedInc,fed,mn,fica,tot:fed+mn+fica,eff:(fed+mn+fica)/Math.max(1,wages+ret+sal+ss),gap:fed-fedSalOnly,jobs:[...jobs].join(', ')};}

/* ---------- Bank transactions (imported from your bank's CSV export, kept only in this file) ---------- */
function parseCSV(t){const rows=[];let row=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];
  if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
  else if(c==='"')q=true;else if(c===','){row.push(f);f='';}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f='';}else f+=c;}
  if(f||row.length){row.push(f);rows.push(row);}return rows.filter(r=>r.length>1);}
function importCSV(text,acct){const R=parseCSV(text),h=R.shift().map(x=>x.trim().toLowerCase()),ix=n=>h.indexOf(n);
  const di=ix('date'),ds=ix('description'),ca=ix('category'),am=ix('amount'),st=ix('status');if(di<0||am<0)throw new Error('This file has no Date and Amount columns.');
  S.tx=S.tx||[];const seen=new Set(S.tx.map(t=>t.join('|')));let n=0;
  R.forEach(r=>{if(st>=0&&/pending/i.test(r[st]))return;const t=[r[di].trim(),(r[ds]||'').trim(),(r[ca]||'').trim(),Math.round(parseFloat(r[am])*100)/100,acct];if(isNaN(t[3])||!/^\d{4}-\d\d-\d\d$/.test(t[0]))return;
    const k=t.join('|');if(!seen.has(k)){seen.add(k);S.tx.push(t);n++;}});
  S.tx.sort((a,b)=>a[0]<b[0]?-1:1);return n;}
const txKey=d=>d.toUpperCase().replace(/[^A-Z ]/g,' ').replace(/\s+/g,' ').trim().split(' ').slice(0,2).join(' ');
const EAT_OUT=/^(Food & Dining|Fast Food|Coffee Shops|Restaurants?|Alcohol & Bars)$/i,GROC=/^Groceries$/i,NOT_BILL=/^(Groceries|Fast Food|Food & Dining|Coffee Shops|Shopping|Gas|Transfer|Credit Card Payment Pending|Category Pending|Uncategorized|Home Improvement|Entertainment|Pharmacy|Auto & Transport)$/i;
function txIsTransfer(t){return /transfer/i.test(t[2])||/TRANSFER|OVERDRAFT ADVANCE/i.test(t[1]);}
function bills(){ // recurring payments found in your bank history, plus any fixes saved in S.plan.billFix
  const T=S.tx||[],fix=(S.plan&&S.plan.billFix)||{},last=T.length?T[T.length-1][0]:'',g={};
  T.forEach(t=>{if(t[3]>=0||txIsTransfer(t)||NOT_BILL.test(t[2]))return;const k=txKey(t[1]);(g[k]=g[k]||[]).push(t);});
  const out=[];for(const [k,v] of Object.entries(g)){const mo=new Set(v.map(t=>t[0].slice(0,7))),F=fix[k]||{};
    if(F.hide)continue;if(!F.due&&!F.name&&(mo.size<4||v.length>mo.size*1.3))continue;const lastT=v[v.length-1][0];
    if(!F.due&&last&&(ymIdx(last.slice(0,7))-ymIdx(lastT.slice(0,7)))>1)continue;
    const med=a=>{const s=a.slice().sort((x,y)=>x-y);return s[Math.floor(s.length/2)];};
    out.push({k,name:F.name||v[v.length-1][1].replace(/\s+/g,' ').slice(0,26),day:F.due||med(v.map(t=>+t[0].slice(8))),amt:F.amt||med([...mo].map(x=>v.filter(t=>t[0].startsWith(x)).reduce((a,t)=>a-t[3],0))),cat:v[0][2],end:F.end||'',paidAround:!F.due,note:F.note||''});}
  Object.entries(fix).forEach(([k,F])=>{if(F.add&&!out.some(b=>b.k===k))out.push({k,name:F.name,day:F.due,amt:F.amt,cat:F.cat||'Bill',end:F.end||'',paidAround:false,note:F.note||''});});
  return out.sort((a,b)=>a.day-b.day);}

/* ---------- Pay days: DFAS pays the 1st and 15th (the business day before if those fall on a weekend or holiday); USAA posts it 2 business days early ---------- */
const HOL={};function holidays(y){if(HOL[y])return HOL[y];const s=new Set(),nth=(m,wd,n)=>{const d=new Date(y,m,1);let c=0;while(true){if(d.getDay()===wd&&++c===n)return new Date(d);d.setDate(d.getDate()+1);}},
  lastMon=m=>{const d=new Date(y,m+1,0);while(d.getDay()!==1)d.setDate(d.getDate()-1);return d;},obs=d=>{const x=new Date(d);if(x.getDay()===6)x.setDate(x.getDate()-1);if(x.getDay()===0)x.setDate(x.getDate()+1);return x;};
  [obs(new Date(y,0,1)),nth(0,1,3),nth(1,1,3),lastMon(4),obs(new Date(y,5,19)),obs(new Date(y,6,4)),nth(8,1,1),nth(9,1,2),obs(new Date(y,10,11)),nth(10,4,4),obs(new Date(y,11,25)),obs(new Date(y+1,0,1))].forEach(d=>s.add(dkey(d)));return HOL[y]=s;}
const dkey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const isBiz=d=>d.getDay()%6!==0&&!holidays(d.getFullYear()).has(dkey(d));
function backBiz(d,n){const x=new Date(d);while(!isBiz(x))x.setDate(x.getDate()-1);for(let k=0;k<n;k++){x.setDate(x.getDate()-1);while(!isBiz(x))x.setDate(x.getDate()-1);}return x;}
function deposits(y,m){ // deposits expected in month m (0-11) of year y
  const out=[],V=S.plan?planView():{},rm=S.plan?ymIdx(V.date.slice(0,7)):1e9,R=S.plan?calcResult():null,T=(S.tx||[]).filter(t=>t[3]>0&&/DEFENSE FINANCE/i.test(t[1]));

  const add=(pay,amt,lab,side)=>{const d=backBiz(pay,2);out.push({d:dkey(d),amt,lab,side,pay:dkey(backBiz(pay,0))});};
  [[y,m,15],[y,m+1,1]].forEach(([yy,mm,dd])=>{const pay=new Date(yy,mm,dd),i=pay.getFullYear()*12+pay.getMonth()-(dd===1?1:0);

function monthItems(y,m){const days={},put=(k,o)=>{(days[k]=days[k]||[]).push(o);},B=bills(),mi=y*12+m,dim=new Date(y,m+1,0).getDate();

  try{const D=deadlines();D.mil.concat(D.sch).forEach(x=>{if(x.d.getFullYear()===y&&x.d.getMonth()===m)put(dkey(x.d),{kind:'dl',lab:x.t,side:x.side,done:x.done});});}catch(e){}
  return days;}

function mealStats(){const T=(S.tx||[]).filter(t=>t[3]<0&&!txIsTransfer(t));if(!T.length)return null;

const RW_DAILY=[['home','Ate at home all day: no delivery or fast food',20],['cook','Cooked a meal',10],['lunch','Packed lunch for duty or clinicals',10],['nospend','No-spend day: only bills and gas',15],['plan','15 minutes on the claim or retirement plan',15],['save','Moved money into savings or paid extra on a debt',25]];

function rewards(){const W=S.rw=Object.assign({days:{},weeks:{}},S.rw||{}),keys=Object.keys(W.days).sort();let pts=0,streak=0,prev=null,best=0;const log=[];
  keys.forEach(k=>{const d=W.days[k],n=RW_DAILY.filter(a=>d[a[0]]).length;if(n<2){streak=0;prev=k;return;}
    const pd=prev&&parseDate(prev),cur=parseDate(k);streak=pd&&Math.round((cur-pd)/DAY)===1&&streak>0?streak+1:1;prev=k;best=Math.max(best,streak);
    const base=RW_DAILY.reduce((s,a)=>s+(d[a[0]]?a[2]:0),0),mult=streakMult(streak),p=Math.round(base*mult);pts+=p;log.push([k,p,mult]);});
  const today=dkey(new Date()),y=new Date();y.setDate(y.getDate()-1);
  const live=W.days[dkey(y)]&&RW_DAILY.filter(a=>W.days[dkey(y)][a[0]]).length>=2||(W.days[today]&&RW_DAILY.filter(a=>W.days[today][a[0]]).length>=2)?streak:0;
  let wk=0;Object.entries(W.weeks).forEach(([k,w])=>{const act=Object.keys(W.days).filter(d=>wkKey(parseDate(d))===k&&RW_DAILY.filter(a=>W.days[d][a[0]]).length>=2).length,m=act>=5?2:1;wk+=Math.round(RW_WEEKLY.reduce((s,a)=>s+(w[a[0]]?a[2]:0),0)*m);});

  const total=pts+wk+auto,ri=RANKS.filter(r=>total>=r[0]).length-1,next=RANKS[ri+1];
  return{W,total,pts,wk,auto,streak:live,best,mult:streakMult(live),rank:RANKS[ri][1],next,pct:next?(total-RANKS[ri][0])/(next[0]-RANKS[ri][0]):1,log};}

function wishCost(x){const W=wishState(),n=+(W.size[x[0]]??x[4]);return[n*x[5]+x[7],n*x[6]+x[8]];}
function vWish(){const W=wishState(),P=S.plan,on=WISH_ITEMS.filter(x=>W.on[x[0]]),tot=on.reduce((a,x)=>{const [l,h]=wishCost(x);return[a[0]+l,a[1]+h];},[0,0]);
  const tile=(l,b,s)=>`<div class="tile"><div class="eyebrow-s">${l}</div><div class="tbig">${b}</div><div class="small muted">${s}</div></div>`,c=k=>`var(--s${k})`;
  const dream=dreamCost([1]);let first=null;
  try{const R=calcResult(),INC=debtIncome(R),sim=simDebts(R,{strat:planView().dstrat||'aval',extra:planView().dextra||'half'},INC),n0=nowIdx();
    for(let y=0;y<=12&&first===null;y++){const i=n0+y*12,row=sim.rows.find(r=>r.i===i)||sim.rows[sim.rows.length-1],dp=row?sim.D.reduce((a,d,k)=>a+(row.bal[k]>0?d.pay:0),0):0;if(buyingPower(R,i,dp).total>=dream.mid)first=i;}}catch(e){}
  const yrs=first===null?99:(first-nowIdx())/12;
  let h=`<div class="stack"><h2>Wishlist</h2><p class="muted">Projects on the house you live in now, with Twin Cities contractor prices for 2026. Change the sizes to match your house; the totals update. Get 3 bids for anything over $5,000.</p>
   <div class="tiles">${tile('Selected projects',`${fmtK(tot[0])} to ${fmtK(tot[1])}`,`${on.length} projects checked`)}${tile('Dream move',first===null?'12+ years':`about ${Math.max(0,Math.round(yrs))} years`,first===null?'from the Dreams tab':`Phase 1 fits about ${ym(first)}`)}${tile('Home value',P&&P.home?money0(P.home.value):'—','county estimate')}</div>
   <div class="panel stack"><div class="eyebrow-s">When to fix up this house</div><p class="small">${yrs<5?`Your dream move is less than 5 years out, so spend on what protects the house and helps it sell: <b>gutters, paint, flooring, and the fence</b>. Skip the room addition and basement extension; buyers usually pay back only half of them or less.`:`Your dream move is ${first===null?'more than 12':'about '+Math.round(yrs)} years out, so you will live here a while. Start with what protects the house and helps it sell (<b>gutters, paint, flooring, fence</b>), then add what you will enjoy for years (garage power and insulation, prairie beds). A new room under the porch makes sense only if you plan to stay 7 or more years.`} Pay cash after the cards are paid off rather than putting projects on credit.</p></div>
   <div class="panel stack">${WISH_ITEMS.map(x=>{const [id,n,u,ul,def,,,,,val,why]=x,[l,hh]=wishCost(x),sz=W.size[id]??def;return `<div class="pl-row ${W.on[id]?'':'off'}"><div class="stack" style="gap:4px"><label class="row" style="gap:10px;align-items:flex-start;cursor:pointer"><input type="checkbox" data-wish="${id}" ${W.on[id]?'checked':''} style="margin-top:4px"><span><b>${esc(n)}</b> <span class="chip ${val==='High'?'good':val==='Medium'?'warn':'plain'}">${val} resale value</span><div class="small muted">${esc(why)}</div></span></label>${u!=='each'?`<label class="row small" style="gap:6px;margin-left:28px"><input type="number" min="0" data-wsize="${id}" value="${esc(sz)}" style="width:90px"> ${esc(ul)}</label>`:''}</div><span class="amt">${fmtK(l)} to ${fmtK(hh)}</span></div>`;}).join('')}</div>
   <div class="panel stack"><div class="eyebrow-s">Cost of each project (midpoint)</div>${hbars(on.map(x=>{const [l,hh]=wishCost(x);return{lab:x[1].replace(/\s*\(.*\)/,''),v:(l+hh)/2,c:x[9]==='High'?c(3):x[9]==='Medium'?c(4):'var(--ink-3)'};}).sort((a,b)=>b.v-a.v))}<p class="small">Green bars usually pay back the most when you sell. The three porch options are alternatives; pick one.</p></div></div>`;
  return h;}
function bindWish(){bindCharts();const W=wishState();
  document.querySelectorAll('[data-wish]').forEach(c=>c.onchange=()=>{W.on[c.dataset.wish]=c.checked;save();render();});
  document.querySelectorAll('[data-wsize]').forEach(el=>el.onchange=()=>{W.size[el.dataset.wsize]=Math.max(0,+el.value||0);save();render();});}

const VIEWS={calc:[vCalc,()=>{bindCalc();bindCharts();}],debt:[vDebt,bindDebt],money:[vMoney,bindDebt],scan:[vScan,bindScan],dash:[vDash,bindDash],steps:[vSteps,bindSteps],me:[vMe,bindMe],conds:[vConds,bindConds],wits:[vWits,bindWits],expo:[vExpo,bindExpo],docs:[vDocs,bindDocs],backup:[vBackup,bindBackup],dates:[vDates,bindDates],save:[vSave,bindSave],cal:[vCal,bindCal],spend:[vSpend,()=>bindCharts()],rw:[vRewards,bindRewards],dream:[vDream,bindDream],wish:[vWish,bindWish]};
function render(){
  if(!VIEWS[S.tab])S.tab='dash';
  renderTabs();renderBanner();renderFileBar();const an=S.appName||'Claim Kit';$('#appName').textContent=an;document.title=an;
  const [v,b]=VIEWS[S.tab];
  try{$('#main').innerHTML=`<section class="view" role="tabpanel" aria-labelledby="tab-${S.tab}">${v()}</section>`;b();}
  catch(e){console.error(e);const bad=S.tab;
    $('#main').innerHTML=`<section class="view"><div class="card warnbox"><h2>This tab hit a problem</h2><p>Your saved data is safe. Nothing was changed or erased.</p><p class="small">${esc(String(e&&e.message||e))}</p><div class="row"><button class="btn primary" id="errHome">Go to Dashboard</button></div></div></section>`;
    $('#errHome').onclick=()=>{S.tab=bad==='dash'?'backup':'dash';save();render();};}
}
load();
const h=(location.hash||'').slice(1);if(VIEWS[h])S.tab=h;
render();
})();
