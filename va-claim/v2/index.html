<title>Retirement Plan v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a field-binder. Sticky tab strip, one working column, dashboard summary first.
   Color code: duty side = olive (things done through the unit, clinic or base),
   off-duty side = nursing blue (writing and uploading you can fit around school). */
:root{
  --bg:#f3f4f1; --surface:#ffffff; --surface-2:#e9ebe5; --line:#d3d7cc;
  --ink:#1d2320; --ink-2:#4e5850; --ink-3:#77817a;
  --accent:#8a6a1f; --accent-ink:#ffffff;
  --duty:#556b2f; --duty-bg:#e7edda; --duty-ink:#3c4d1f;
  --study:#1f6f9e; --study-bg:#dcecf6; --study-ink:#154f72;
  --good:#2f7d4f; --warn:#a86a00; --bad:#b23b2e; --warn-bg:#fbefd6; --bad-bg:#f8e1dd;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:6px;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#6250d6;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141815; --surface:#1c211d; --surface-2:#252b26; --line:#343c35;
  --ink:#e6e9e3; --ink-2:#b2bab2; --ink-3:#88918a;
  --accent:#d1a64a; --accent-ink:#1a1405;
  --duty:#9bb86a; --duty-bg:#26301b; --duty-ink:#bcd48f;
  --study:#6cb6e3; --study-bg:#16293a; --study-ink:#9fd0ef;
  --good:#6cc28f; --warn:#e3a640; --bad:#ef7d6f; --warn-bg:#33270f; --bad-bg:#3a1c18;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141815; --surface:#1c211d; --surface-2:#252b26; --line:#343c35;
  --ink:#e6e9e3; --ink-2:#b2bab2; --ink-3:#88918a;
  --accent:#d1a64a; --accent-ink:#1a1405;
  --duty:#9bb86a; --duty-bg:#26301b; --duty-ink:#bcd48f;
  --study:#6cb6e3; --study-bg:#16293a; --study-ink:#9fd0ef;
  --good:#6cc28f; --warn:#e3a640; --bad:#ef7d6f; --warn-bg:#33270f; --bad-bg:#3a1c18;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;margin:0}
.wrap{max-width:1440px;margin:0 auto;padding-inline:16px;padding-block:0 64px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0}
h1{font-size:2rem;line-height:1.05}
h2{font-size:1.5rem;line-height:1.1}
h3{font-size:1.15rem}
p{margin:0}
.mono{font-family:var(--f-mono);font-size:.85em}
.muted{color:var(--ink-2)}
.small{font-size:.85rem}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.grid2>*{min-width:0}

header.top{padding-block:20px 12px;display:flex;flex-wrap:wrap;gap:12px;align-items:end;justify-content:space-between}
.brand .eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.legend{display:flex;gap:8px;flex-wrap:wrap}
.gbar{display:flex;flex-wrap:wrap;gap:8px 18px;padding:10px 12px;margin-bottom:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.gbar .g{display:flex;flex-direction:column;gap:4px;padding-left:8px;border-left:3px solid var(--line)}
.gbar .g-duty{border-left-color:var(--duty)}.gbar .g-study{border-left-color:var(--study)}
.gbar .seg .btn{padding:3px 9px}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
nav.tabs button{font:600 .95rem var(--f-display);letter-spacing:.06em;text-transform:uppercase;background:none;border:0;color:var(--ink-2);padding:12px 10px 10px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs button:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
section.view{padding-top:20px}
section.view>.stack{gap:16px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.banner{border-radius:var(--r);padding:12px 14px;background:var(--warn-bg);color:var(--ink);border:1px solid var(--warn);display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.viz .asofl{stroke:var(--accent);stroke-width:2}.viz .evl.asof{stroke:var(--accent);stroke-dasharray:none;stroke-width:2}
.asof input[type=range]{width:100%;accent-color:var(--accent)}
.filebar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:12px 0 0;padding:8px 12px;border-radius:10px;background:var(--surface-2)}
.filebar.dirty{outline:1px solid var(--accent)}
.chip{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;font-size:.75rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:999px;white-space:nowrap}
.chip.duty{background:var(--duty-bg);color:var(--duty-ink)}
.chip.study{background:var(--study-bg);color:var(--study-ink)}
.chip.good{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.plain{background:var(--surface-2);color:var(--ink-2)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.dot.duty{background:var(--duty)}.dot.study{background:var(--study)}

button.btn{font:600 .9rem var(--f-body);padding:8px 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
button.btn:hover{border-color:var(--ink-3)}
button.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.btn.danger{color:var(--bad);border-color:var(--bad)}
button.btn.sm{padding:4px 10px;font-size:.8rem}
button.link{background:none;border:0;padding:0;color:var(--study);font:inherit;text-decoration:underline;cursor:pointer}

label.f{display:flex;flex-direction:column;gap:4px;font-size:.85rem;font-weight:600;color:var(--ink-2)}
label.f .hint{font-weight:400;color:var(--ink-3);font-size:.8rem}
input[type=text],input[type=date],input[type=email],input[type=tel],select,textarea{font:400 .95rem var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;width:100%}
textarea{min-height:76px;resize:vertical}
textarea.doc{font-family:var(--f-mono);font-size:.85rem;min-height:320px;line-height:1.55;background:var(--surface)}

/* Dashboard */
.dash-head{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
@media (max-width:560px){.dash-head{grid-template-columns:1fr;justify-items:start}}
.ring{width:132px;height:132px}
.ring text{font-family:var(--f-display);font-weight:700;fill:var(--ink)}
.timeline{position:relative;padding-top:6px}
.tl-bar{position:relative;height:10px;border-radius:5px;background:var(--surface-2);margin:34px 0 34px}
.tl-win{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--duty) 45%,transparent);border-radius:5px}
.tl-mark{position:absolute;top:-6px;width:2px;height:22px;background:var(--ink-3)}
.tl-mark.today{background:var(--accent);width:3px}
.tl-lab{position:absolute;font-size:.72rem;white-space:nowrap;transform:translateX(-50%);color:var(--ink-2);font-variant-numeric:tabular-nums}
.tl-lab.up{top:-30px}.tl-lab.down{top:18px}
.tl-lab b{color:var(--ink);font-weight:600}
.phase-row{display:grid;grid-template-columns:150px 1fr 48px;gap:10px;align-items:center;font-variant-numeric:tabular-nums}
@media (max-width:480px){.phase-row{grid-template-columns:110px 1fr 40px}}
.bar{height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden;display:flex}
.bar>span{display:block;height:100%}
.bar .d{background:var(--duty)}.bar .s{background:var(--study)}
.cond-table{width:100%;border-collapse:collapse;font-size:.88rem}
.cond-table th{text-align:left;font-weight:600;color:var(--ink-3);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;padding:6px 8px;border-bottom:1px solid var(--line)}
.cond-table td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
.cond-table td.c{text-align:center}
.tick{font-weight:700}
.tick.y{color:var(--good)}.tick.n{color:var(--ink-3)}
.scroll-x{overflow-x:auto}
.next li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.next li:last-child{border-bottom:0}
ul.clean{list-style:none;margin:0;padding:0}

/* Steps */
.task{display:grid;grid-template-columns:24px 1fr;gap:10px;padding:12px 12px 12px 10px;border-left:4px solid var(--line);background:var(--surface);border-radius:0 var(--r) var(--r) 0}
.task.duty{border-left-color:var(--duty)}.task.study{border-left-color:var(--study)}
.task input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent)}
.task.done .t-title{text-decoration:line-through;color:var(--ink-3)}
.t-title{font-weight:600}
.t-body{font-size:.88rem;color:var(--ink-2);margin-top:2px}
.t-meta{margin-top:6px}

/* Conditions */
.cond-card{border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.cond-card>summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.cond-card>summary::-webkit-details-marker{display:none}
.cond-card[open]>summary{border-bottom:1px solid var(--line)}
.cond-body{padding:14px;display:flex;flex-direction:column;gap:12px}
.meter{display:inline-flex;gap:2px}
.meter i{width:14px;height:6px;border-radius:2px;background:var(--surface-2)}
.meter i.on{background:var(--good)}

.doc-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.doc-pick{text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer;color:var(--ink);font:inherit;display:flex;flex-direction:column;gap:2px}
.doc-pick[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.doc-pick .form{font-family:var(--f-mono);font-size:.75rem;color:var(--accent)}
.doc-pick .nm{font-weight:600}
.doc-pick .st{font-size:.78rem;color:var(--ink-3)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:var(--r);font-weight:600;z-index:20}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px;border:1px solid var(--bad);border-radius:var(--r);background:var(--bad-bg)}
a{color:var(--study)}
.kv{display:grid;grid-template-columns:fit-content(55%) minmax(0,1fr);gap:4px 14px;font-size:.9rem}
.kv dt{color:var(--ink-3)}.kv dd{margin:0;font-variant-numeric:tabular-nums}
.calc-head{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px}
.calc-head .big{font-family:var(--f-display);font-weight:700;font-size:3rem;line-height:1;font-variant-numeric:tabular-nums}
.eyebrow-s{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.calc-row{display:grid;grid-template-columns:minmax(0,1fr) 120px 170px 36px;gap:8px;align-items:center;padding-block:6px;border-bottom:1px solid var(--line)}
.calc-row .why{grid-column:1/-1;margin:0}
.calc-row .nm{font-weight:600;min-width:0;overflow-wrap:anywhere}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}.seg .btn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pl-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:start;padding:8px 0 8px 10px;border-bottom:1px solid var(--line);border-left:4px solid var(--line)}
.pl-row.duty{border-left-color:var(--duty)}.pl-row.pers{border-left-color:var(--s4)}.pl-row.study{border-left-color:var(--study)}.pl-row .amt{font-variant-numeric:tabular-nums;font-weight:600}
details.panel>summary{cursor:pointer}
.panel-in{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface-2)}
.tgl{cursor:pointer}.tgl input{margin-top:4px;accent-color:var(--accent);width:18px;height:18px;flex:none}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.tile{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface-2)}
.tbig{font-family:var(--f-display);font-weight:700;font-size:1.8rem;line-height:1.1;font-variant-numeric:tabular-nums}
.warnbox{background:var(--warn-bg);border-left:4px solid var(--warn);padding:8px 10px;border-radius:6px}
.chart-wrap{position:relative}.viz{width:100%;height:auto;display:block;overflow:visible}
.viz .grid{stroke:var(--line);stroke-width:1}.viz .zero{stroke:var(--ink-3);stroke-width:1}.viz .axl{stroke:var(--ink-3)}
.viz .ax{fill:var(--ink-3);font:11px var(--f-mono)}.viz .lab{fill:var(--ink-2);font:12px var(--f-body)}
.viz .area{stroke:var(--surface);stroke-width:1.5;stroke-linejoin:round}.viz .ghost{fill:var(--line)}.viz .ln{fill:none;stroke-width:2;stroke-linejoin:round}
.viz .evl{stroke-width:1.5;stroke-dasharray:3 3;stroke:var(--ink-3)}.viz .evl.duty{stroke:var(--duty)}.viz .evl.study{stroke:var(--study)}
.viz .evc{fill:var(--accent);stroke:var(--surface);stroke-width:2}.viz .evc.duty{fill:var(--duty)}.viz .evc.study{fill:var(--study)}
.viz .evn{fill:#fff;font:600 10px var(--f-mono);pointer-events:none}.viz .hit{fill:transparent;cursor:crosshair}.viz .xh{stroke:var(--ink-2);stroke-width:1}
.viz [data-tip]{cursor:pointer}.viz .gapfill{fill:var(--s1);opacity:.15}
.tip{position:absolute;z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:.8rem;box-shadow:0 4px 14px rgba(0,0,0,.15);pointer-events:none;max-width:260px}
.tip .tr{display:grid;grid-template-columns:10px 1fr auto;gap:6px;align-items:center}.tip i{width:10px;height:10px;border-radius:3px;display:inline-block}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--ink-2)}.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.evs{list-style:none;padding:0;margin:0;display:grid;gap:8px}.ev{display:grid;grid-template-columns:24px 1fr;gap:10px;padding:8px 10px;border-left:4px solid var(--accent);background:var(--surface-2);border-radius:6px}
.ev.duty{border-left-color:var(--duty)}.ev.study{border-left-color:var(--study)}
.evb{width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font:600 11px var(--f-mono);display:grid;place-items:center}.ev.duty .evb{background:var(--duty)}.ev.study .evb{background:var(--study)}
.pl-row.off{opacity:.5}.pl-row.tot{border-left-color:var(--accent)}
.pos{color:var(--good)}.neg{color:var(--bad)}
.path-row{display:grid;grid-template-columns:minmax(0,9rem) minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 0}
.path-bar{position:relative;height:22px;background:var(--surface);border-radius:6px;overflow:hidden}
.path-bar .fill{position:absolute;inset:0 auto 0 0;border-radius:6px}.path-bar .fill.work{background:var(--study)}.path-bar .fill.ret{background:var(--duty)}
.path-bar .tick{position:absolute;top:-2px;bottom:-2px;width:3px;background:var(--ink);transform:translateX(-1px)}
.tbl-wrap{overflow-x:auto;max-height:520px;overflow-y:auto;border:1px solid var(--line);border-radius:8px}
.mtbl{border-collapse:collapse;width:100%;font-size:.85rem;font-variant-numeric:tabular-nums}
.mtbl th,.mtbl td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.mtbl th:first-child,.mtbl td:first-child{text-align:left;white-space:normal;min-width:9rem}
.mtbl thead th{position:sticky;top:0;background:var(--surface);font-weight:600}
.mtbl tr.yr td{font-weight:700;background:var(--surface)}
.yr-amt{font-weight:400}
.path-row .amt{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
@media (max-width:560px){.path-row{grid-template-columns:1fr auto}.path-row .path-bar{grid-column:1/-1;grid-row:2}}
@media (max-width:560px){.calc-row{grid-template-columns:1fr 1fr}.calc-row>:first-child{grid-column:1/-1}.calc-row>:last-child:empty{display:none}}
@media (prefers-reduced-motion:no-preference){.bar>span,.ring circle{transition:all .4s ease}}
.calgrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}@media (max-width:900px){.calgrid{grid-template-columns:1fr}}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.cw{font:600 .7rem var(--f-mono);text-transform:uppercase;color:var(--ink-3);text-align:center;padding:2px 0}
.cd{min-height:92px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:4px;display:flex;flex-direction:column;gap:2px;text-align:left;cursor:pointer;font:inherit;color:inherit;min-width:0;overflow:hidden}
.cd.off{border:0;background:transparent;cursor:default}.cd.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}.cd.sel{background:var(--surface-2);outline:2px solid var(--study)}
.cn{font:600 .8rem var(--f-mono);color:var(--ink-2)}.ci{font-size:.68rem;line-height:1.25;padding:1px 4px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci.dep{background:var(--duty-bg);color:var(--duty-ink);font-weight:700}.ci.bill{background:var(--warn-bg);color:var(--warn)}.ci.dl.study{background:var(--study-bg);color:var(--study-ink)}.ci.dl.duty{border:1px dashed var(--duty);color:var(--duty-ink)}.ci.more{color:var(--ink-3)}
@media (max-width:560px){.cd{min-height:58px}.ci{font-size:0;padding:0;height:6px;border-radius:3px}.ci.more{display:none}}
.dot.warnd{background:var(--warn)}
.rank{display:inline-grid;place-items:center;min-width:54px;height:54px;padding:0 8px;border-radius:12px;background:var(--duty);color:#fff;font:700 1rem var(--f-display);letter-spacing:.04em}.rank.big{min-width:76px;height:76px;font-size:1.3rem}
.rwdays{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}.rwday{height:28px;border-radius:6px;background:var(--surface-2);display:grid;place-items:center;font:600 .65rem var(--f-mono);color:var(--ink-3)}.rwday.half{background:var(--study-bg);color:var(--study-ink)}.rwday.on{background:var(--duty);color:#fff}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.grid3>*{min-width:0}
.goodbox{background:color-mix(in srgb,var(--good) 14%,transparent);border-left:4px solid var(--good);padding:8px 10px;border-radius:6px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
input[type=number]{font:400 .95rem var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;width:100%}
input[type=range]{accent-color:var(--accent);width:100%}
.panel.duty,.tile.duty{border-left:4px solid var(--duty)}.panel.study,.tile.study{border-left:4px solid var(--study)}.panel.money,.tile.money{border-left:4px solid var(--accent)}
.mtbl td.num{text-align:right}
.gbar details.more{flex-basis:100%;border-left-color:var(--accent)}.gbar details.more summary{cursor:pointer}.gbar .gbar.in{border:0;padding:6px 0 0;margin:0;background:none}
.gbar .g-money{border-left-color:var(--accent)}

<script>
/* Retirement Plan v2: money only. Personal numbers come from the data saved inside this file (S.fin); the code holds none. */
const KEY='retplan2.v1';
const TABS2=[];
let S;
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money0=n=>(+n||0).toLocaleString('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0});
const money2=n=>(+n||0).toLocaleString('en-US',{style:'currency',currency:'USD',minimumFractionDigits:2,maximumFractionDigits:2});
const fmtK=n=>{const a=Math.abs(n),s=n<0?'−':'';return a>=1e6?`${s}$${(a/1e6).toFixed(2)}M`:a>=1000?`${s}$${(a/1000).toFixed(a>=100000?0:1)}k`:`${s}$${Math.round(a)}`;};
const pct1=x=>`${(x*100).toFixed(1)}%`;
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const ymIdx=s=>{const [y,m]=String(s).split('-').map(Number);return y*12+m-1;};
const ym=i=>`${MON[((i%12)+12)%12]} ${Math.floor(i/12)}`;
const idxYM=i=>`${Math.floor(i/12)}-${String(i%12+1).padStart(2,'0')}`;
const DAY=864e5,dayNum=(y,m,d)=>Math.round(Date.UTC(y,m,d)/DAY),dayDate=n=>new Date(n*DAY);
const dayOfIdx=i=>dayNum(Math.floor(i/12),i%12,1),idxOfDay=n=>{const d=dayDate(n);return d.getUTCFullYear()*12+d.getUTCMonth();};
const fmtDay=n=>{const d=dayDate(n);return `${d.getUTCDate()} ${MON[d.getUTCMonth()]} ${d.getUTCFullYear()}`;};
const todayNum=()=>{const d=new Date();return dayNum(d.getFullYear(),d.getMonth(),d.getDate());};
function ageAt(x){const b=ymIdx(S&&S.fin&&S.fin.born||'1970-01');const i=typeof x==='number'?(x>3000?x:x*12+5):ymIdx(x);return Math.floor((i-b)/12);}

/* ---------- Saving: browser storage plus a copy inside this HTML file ---------- */
function blank(){return{rev:0,savedAt:0,tab:'time',ch:{},hidden:{},view:null,fin:null};}
function embedded(){try{const o=JSON.parse($('#rpdata').textContent);return o&&o.fin?o:null;}catch(e){return null;}}
function load(){SRC0=document.documentElement.outerHTML;let loc=null;try{const r=localStorage.getItem(KEY);if(r)loc=JSON.parse(r);}catch(e){}
  const emb=embedded(),pick=loc&&emb?((emb.rev||0)>(loc.rev||0)?emb:(loc.rev||0)>(emb.rev||0)?loc:(+loc.savedAt||0)>=(+emb.savedAt||0)?loc:emb):loc||emb;
  S=Object.assign(blank(),pick||{});FILE.savedAt=emb?emb.savedAt||1:0;}
let SRC0='';
const FILE={handle:null,savedAt:0,busy:false,timer:null};

function idb(){return new Promise((ok,no)=>{try{const r=indexedDB.open('retplan2-file',1);r.onupgradeneeded=()=>r.result.createObjectStore('h');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error);}catch(e){no(e);}});}
async function idbGet(){try{const db=await idb();return await new Promise(ok=>{const q=db.transaction('h').objectStore('h').get('file');q.onsuccess=()=>ok(q.result||null);q.onerror=()=>ok(null);});}catch(e){return null;}}
async function idbPut(h){try{const db=await idb();db.transaction('h','readwrite').objectStore('h').put(h,'file');}catch(e){}}
async function writeFile(){if(!FILE.handle||FILE.busy)return false;FILE.busy=true;
  try{const w=await FILE.handle.createWritable();await w.write(fileCopy());await w.close();FILE.savedAt=S.savedAt;FILE.busy=false;renderFileBar();return true;}
  catch(e){FILE.busy=false;FILE.handle=null;renderFileBar();return false;}}
async function saveToFile(){S.savedAt=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
  const name=(S.appName||'Retirement Plan v2')+'.html';
  if(window.showSaveFilePicker){try{if(!FILE.handle){const old=await idbGet();if(old&&(await old.requestPermission({mode:'readwrite'}))==='granted')FILE.handle=old;}
      if(!FILE.handle){FILE.handle=await showSaveFilePicker({suggestedName:name,types:[{description:'Retirement plan',accept:{'text/html':['.html']}}]});idbPut(FILE.handle);}
      if(await writeFile()){toast('Saved into the file');return;}}catch(e){if(e&&e.name==='AbortError')return;}}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([fileCopy()],{type:'text/html'}));a.download=name;document.body.appendChild(a);a.click();a.remove();
  FILE.savedAt=S.savedAt;renderFileBar();toast('Saved a new copy to Downloads');}
function renderFileBar(){const el=$('#fileBar');if(!el)return;const dirty=(S.savedAt||0)>(FILE.savedAt||0);
  el.innerHTML=`<div class="filebar ${dirty?'dirty':''}"><span class="small">${FILE.handle?'<b>Auto-save is on.</b> Every change is written into this file.':dirty?'<b>You have changes not saved in the file yet.</b> They are kept in this browser too.':'<b>Your data is saved inside this file.</b> Nothing is uploaded.'}</span><button class="btn sm ${dirty&&!FILE.handle?'primary':''}" id="saveFile">${FILE.handle?'Save now':'Save to file'}</button></div>`;
  $('#saveFile').onclick=saveToFile;}
let saveTimer;
function save(){S.savedAt=Date.now();clearTimeout(saveTimer);saveTimer=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
  if(FILE.handle){clearTimeout(FILE.timer);FILE.timer=setTimeout(writeFile,1200);}else renderFileBar();},200);}
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(t._h);t._h=setTimeout(()=>t.hidden=true,1800);}

/* ---------- Choices shared by every tab ---------- */
const CH_DEF={date:'2027-09-30',rp:'mab',rn:'term',job:'rn',emp:'civ',city:'tc',va:'est',pt:'no',ptf:'.6',adj:'off',adjn:'4',stop:'65',ss:'67',dx:'half',mx:'0',dnp:'cash',dollars:'future'};
function ch(){S.ch=Object.assign({},CH_DEF,S.ch||{});return S.ch;}
function plan2(){return Object.assign({},ch());}
function seg(key,opts,cls){const V=ch();return `<div class="seg ${cls||''}" role="group">${opts.map(([v,n])=>`<button class="btn sm ${V[key]===v?'on':''}" data-ch="${key}" data-val="${v}" aria-pressed="${V[key]===v}">${n}</button>`).join('')}</div>`;}
function gBar(){const F=S.fin;if(!F)return'';const V=ch();
  const opt=Object.keys(F.ret.options).sort().map(d=>[d,F.ret.options[d].label]);

  return `<div class="gbar" role="group" aria-label="Choices used on every tab">
   ${g('duty','Retire from AGR',seg('date',opt))}
   ${g('duty','Retired pay estimate',seg('rp',[['mab','Army calculator'],['pts','Points ÷ 360']]))}

   ${g('study','Nursing job',seg('job',[['rn','BSN RN'],['np','PMHNP (DNP)']]))}
   ${g('study','Employer',seg('emp',[['civ','Hospital'],['va','The VA']]))}
   ${V.emp==='va'?'':g('study','City',seg('city',[['tc','Twin Cities'],['roch','Rochester']]))}
   ${g('duty','VA rating',seg('va',[['est',`Estimate (${F.va.est}%)`],['50','50%'],['100','100%']]))}
   <details class="g g-money more"${S.moreOpen?' open':''}><summary class="eyebrow-s">More choices: later work, Social Security, debts</summary><div class="gbar in">
    ${g('study','Part time from age',seg('pt',[['no','Never'],['55','55'],['60','60'],['62','62']]))}
    ${V.pt==='no'?'':g('study','Part-time hours',seg('ptf',[['.6','0.6 (3 shifts)'],['.4','0.4 (2 shifts)'],['.2','PRN']]))}
    ${g('study','Teach nursing (adjunct)',seg('adj',[['off','No'],['50','From 50'],['55','From 55'],['60','From 60']]))}
    ${V.adj==='off'?'':g('study','Courses a year',seg('adjn',[['2','2'],['4','4'],['6','6']]))}
    ${g('study','Stop working at',seg('stop',[['62','62'],['65','65'],['67','67'],['70','70']]))}
    ${g('money','Social Security at',seg('ss',[['62','62'],['67','67'],['70','70']]))}
    ${g('money','Extra toward debt',seg('dx',[['none','None'],['half','Half of what is left'],['all','All of it']]))}
    ${g('money','Extra on the mortgage',seg('mx',[['0','None'],['250','$250'],['500','$500'],['1000','$1,000']]))}
    ${V.job==='np'?g('study','Pay for the DNP with',seg('dnp',[['cash','Take-home'],['loan','Federal loans']])):''}
    ${g('money','Show money in',seg('dollars',[['future','Future dollars'],['today',"Today's dollars"]]))}
   </div></details>
  </div>`;}
function bindGbar(){$$('[data-ch]').forEach(b=>b.onclick=()=>{ch()[b.dataset.ch]=b.dataset.val;MODEL=null;save();render();});
  const d=$('.gbar details.more');if(d)d.ontoggle=()=>{S.moreOpen=d.open;};}

/* ---------- Pay and tax tables (2026) ---------- */
const JOBS={rn:{name:'BSN RN',tc:[90000,100860],roch:[83000,106510]},np:{name:'PMHNP',tc:[140000,161000],roch:[125000,140000]}};
const VA_NURSE={rn:{table:[[90469,2714],[106752,3202],[116359,3490]],promo:[[2,1]],g0:0},np:{table:[[111359,3340],[131400,3942],[143226,4296]],promo:[[3,2]],g0:1},stepsAt:[1,2,3,5,7,9,12,15,18,21,24]};
function vaNursePay(job,yrs){const T=VA_NURSE[job],rate=(g,st)=>T.table[g][0]+T.table[g][1]*(st-1),earned=t=>VA_NURSE.stepsAt.filter(x=>x<=t).length;
  let g=T.g0,st=1,since=0;for(const [at,to] of T.promo){if(yrs<at)break;st=Math.min(12,st+earned(at-since));const before=rate(g,st);g=to;let n=1;while(n<12&&rate(g,n)<=before)n++;st=n;since=at;}
  st=Math.min(12,st+earned(yrs-since));return rate(g,st);}
const TAX={fedStd:16100,fed65:2050,fed:[[12400,.10],[50400,.12],[105700,.22],[201775,.24],[256225,.32],[640600,.35],[1/0,.37]],mnStd:15300,mn:[[33310,.0535],[109430,.068],[203150,.0785],[1/0,.0985]],ssBase:184500};
const VA_RATE={10:180.42,20:356.66,30:552.47,40:795.84,50:1132.90,60:1435.02,70:1808.45,80:2102.15,90:2362.30,100:3938.58}; // single veteran, Dec 2025 rates
const TRICARE_SELECT=186.96,PART_B=202.90,INFL=.025,COLA=.025,RAISE=.03;
function bracketTax(x,br){let t=0,lo=0;for(const [top,r] of br){if(x<=lo)break;t+=(Math.min(x,top)-lo)*r;lo=top;}return t;}
const SS_F={62:.70,67:1,70:1.24};

/* ---------- Retired pay ---------- */
function retPay(V){const F=S.fin,O=F.ret.options[V.date]||F.ret.options[Object.keys(F.ret.options)[0]];
  if(V.rp==='pts'){const mult=Math.min(.75,.025*O.points/360);return{mult,high3:O.high3,gross:O.high3*mult,how:`${(O.points/360).toFixed(2)} years from ${O.points.toLocaleString()} points ÷ 360`};}
  const mo=ymIdx(V.date.slice(0,7))-ymIdx(F.ret.asd),mult=.025*mo/12;
  return{mult,high3:O.mabHigh3,gross:O.mabHigh3*mult,how:`${Math.floor(mo/12)} years ${mo%12} months of service from your May 2006 active service date, as the Army calculator counts it`};}

/* ---------- The month-by-month model ---------- */
let MODEL=null;
function rnStartIdx(V){const F=S.fin,rm=ymIdx(V.date.slice(0,7)),O=F.ret.options[V.date],tl=ymIdx((O.termStart||V.date).slice(0,7));
  return {jun:ymIdx('2027-06'),jul:ymIdx('2027-07'),term:tl,after:rm+1}[V.rn]??rm+1;}
function model(){if(MODEL)return MODEL;const F=S.fin,V=ch();
  const born=ymIdx(F.born),start=ymIdx(F.start),end=born+12*90+6,rm=ymIdx(V.date.slice(0,7)),O=F.ret.options[V.date];
  const tl=ymIdx((O.termStart||V.date).slice(0,7)),rn0=rnStartIdx(V),npI=ymIdx(F.dnp.npStart),age=i=>(i-born)/12;
  const RP=retPay(V),vaPct=V.va==='est'?F.va.est:+V.va,vaBase=VA_RATE[vaPct]||0;
  const ptI=V.pt==='no'?1e9:born+12*+V.pt,stopI=born+12*+V.stop,adjI=V.adj==='off'?1e9:born+12*+V.adj,adjEnd=born+12*Math.max(+V.stop,70);
  const ssI=born+12*+V.ss,ss0=F.ss67*SS_F[V.ss];
  const debts=F.debts.map(d=>({...d,b:d.bal,end:null}));
  const M=F.mortgage;let mb=M.bal;for(let i=ymIdx(M.balAt);i<start;i++)mb=Math.max(0,mb+mb*M.rate/12-M.pi);let mEnd=null;
  const rows=[];let short=0,cum=0;
  const dnpOn=V.job==='np',dS=ymIdx(F.dnp.start),dE=ymIdx(F.dnp.end),lS=ymIdx(F.dnp.loanStart);
  const work=V.job==='np'?'np':'rn',hosp=JOBS[work][V.city]||JOBS[work].tc;
  const jobPay=(i)=>{ // yearly salary in month i
    const isNp=dnpOn&&i>=npI,j=isNp?'np':'rn',s0=isNp?Math.max(npI,rn0):rn0,yrs=Math.max(0,Math.floor((i-s0)/12)),cal=Math.floor(i/12);
    if(V.emp==='va'){let f=1;for(let y=2027;y<=cal;y++)f*=y===2027?1:1.02;return{j,yrs,sal:vaNursePay(j,yrs)*f};}
    const H=JOBS[j][V.city]||JOBS[j].tc;return{j,yrs,sal:yrs<3?H[0]+(H[1]-H[0])*yrs/3:H[1]*Math.pow(1+RAISE,yrs-3)};};
  for(let i=start;i<=end;i++){const yrsFrom=(i-start)/12,infl=Math.pow(1+INFL,yrsFrom),a=age(i);
    const col=Math.pow(1+COLA,Math.max(0,Math.floor(i/12)-Math.floor((rm+1)/12)));
    const inc={},net={};let gross=0,takeHome=0,notes=[];
    // AGR pay
    if(i<=rm){const extra=i>ymIdx(F.agr.tspLoanEnd)?F.agr.tspLoanMo:0;inc.agr=F.agr.basic+F.agr.allow;net.agr=F.agr.net+extra;}
    // nursing pay
    let job=null;
    if(i>=rn0&&i<stopI){const P=jobPay(i);let fte=1;
      if(i<tl)fte=.5; // working on leave days before terminal leave
      if(i>=ptI)fte=+V.ptf;
      const sal=P.sal*fte;job={...P,fte,sal};inc.job=sal/12;}
    // adjunct teaching: paid over the school months
    if(i>=adjI&&i<adjEnd&&[0,1,2,3,8,9,10,11].includes(i%12)){const per=adjPerCourse(V);inc.adj=per*+V.adjn*Math.pow(1+INFL,Math.max(0,Math.floor(i/12)-2026))/8;}
    // retired pay and VA pay
    if(i>rm){inc.ret=RP.gross*col;const va=vaBase*col;inc.va=va;if(vaPct<50)inc.ret=Math.max(0,inc.ret-va);}
    if(i>=ssI)inc.ss=ss0*Math.pow(1+COLA,Math.max(0,Math.floor(i/12)-2026));
    gross=Object.values(inc).reduce((s,x)=>s+x,0);
    // taxes on everything but AGR (AGR take-home is your real deposit)
    const f=Math.pow(1+INFL,Math.max(0,Math.floor(i/12)-2026)),wages=(inc.job||0)+(inc.adj||0);
    const fedInc=12*(wages+(inc.ret||0)+(inc.ss||0)*.85),std=(TAX.fedStd+(a>=65?TAX.fed65:0))*f;
    let fed=0,mn=0,fica=0,ret401=0,health=0;
    if(i>rm||inc.job){const agrPart=i<=rm?12*F.agr.basic:0;
      const tot=bracketTax(Math.max(0,(fedInc+agrPart)/f-std/f),TAX.fed)*f/12,base=i<=rm?bracketTax(Math.max(0,agrPart/f-std/f),TAX.fed)*f/12:0;fed=tot-base;
      mn=bracketTax(Math.max(0,12*wages/f-TAX.mnStd),TAX.mn)*f/12;fica=Math.min(wages,TAX.ssBase*f/12)*.062+wages*.0145;ret401=(inc.job||0)*.05;
      if(i>rm)health=a>=65?PART_B*infl:TRICARE_SELECT/12*infl;}
    takeHome=(net.agr||0)+(gross-(inc.agr||0))-fed-mn-fica-ret401-health;
    // spending
    const seg={};
    F.bills.forEach(b=>{if(b.end&&i>ymIdx(b.end))return;seg['b:'+b.name]=b.amt*infl;});
    F.living.forEach(l=>{seg['l:'+l.k]=l.v*infl;});
    if(dnpOn&&V.dnp==='cash'&&i>=dS&&i<=dE)seg['s:DNP school (tuition and fees you pay)']=F.dnp.cashMo;
    if(dnpOn&&V.dnp==='loan'&&i>=lS&&i<lS+120)seg['s:DNP federal loan payment']=F.dnp.loanMo;
    // mortgage
    if(mb>0){const it=mb*M.rate/12,pay=Math.min(mb+it,M.pi+(+V.mx||0));mb=Math.max(0,mb+it-pay);seg['h:PennyMac mortgage']=pay+M.escrow*infl;if(mb<=0&&mEnd===null)mEnd=i;}
    else seg['h:Property tax and home insurance']=M.escrow*infl;
    const fixed=Object.values(seg).reduce((s,x)=>s+x,0);
    // debts: minimums, then extra to the highest rate
    debts.forEach(d=>{if(d.b>0)d.b+=d.b*d.apr/12;});let paid=0;
    debts.forEach(d=>{if(d.b>0){const p=Math.min(d.pay,d.b);d.b-=p;paid+=p;seg['d:'+d.name]=(seg['d:'+d.name]||0)+p;}});
    let left=takeHome-fixed-paid;
    if(left>0&&V.dx!=='none'){let room=V.dx==='all'?left:left/2;for(const d of debts.filter(d=>d.b>.5).sort((x,y)=>y.apr-x.apr)){if(room<=0)break;const p=Math.min(room,d.b);d.b-=p;room-=p;paid+=p;left-=p;seg['d:'+d.name]=(seg['d:'+d.name]||0)+p;}}
    if(left<0){const c=debts.find(d=>d.id===F.shortfallTo)||debts[0];c.b+=-left;if(c.end!==null)c.end=null;short+=-left;notes.push('short');}
    debts.forEach(d=>{if(d.b<=.5&&d.end===null&&d.b!==-1){d.b=0;d.end=i;}});
    cum+=left;
    rows.push({i,age:a,inc,gross,net:takeHome,fed,mn,fica,ret401,health,seg,spend:fixed+paid,left,cum,job,bal:debts.map(d=>d.b),mort:mb});
  }
  const debtFree=rows.find(r=>r.bal.every(b=>b<=.5));
  MODEL={rows,start,end,rm,tl,rn0,npI,RP,vaPct,debts,mEnd,short,debtFree:debtFree?debtFree.i:null,born,ptI,stopI,adjI,ssI,V};
  return MODEL;}
function dv(v,i){const F=S.fin;return ch().dollars==='today'?v/Math.pow(1+INFL,Math.max(0,(i-ymIdx(F.start))/12)):v;}

/* ---------- Key dates ---------- */
function keyDates(){const F=S.fin,V=ch(),m=model(),b=m.born,O=F.ret.options[V.date],out=[];
  const add=(day,side,t,pri,x)=>out.push({day,side,t,pri,x:x||''});const d1=i=>dayOfIdx(i);
  const dd=s=>{const [y,mo,da]=s.split('-').map(Number);return dayNum(y,mo-1,da||1);};
  add(todayNum(),'today','Today',0);
  (F.events||[]).forEach(e=>add(dd(e.at),e.side,e.t,e.pri||2,e.x));

/* ---------- A simple line chart other tabs can use ---------- */
function lineChart(cfg){const W=720,H=cfg.height||260,p={l:56,r:12,t:12,b:28},L=cfg.labels||[],n=L.length;if(!n)return'';
  const all=[];const stack=cfg.stack;const acc=new Array(n).fill(0);const ser=cfg.series.map(s=>{const v=s.values.map((x,k)=>stack?(acc[k]+=+x||0):+x||0);all.push(...v);return{...s,v};});
  const mx=Math.max(1,...all),mn=Math.min(0,...all),X=k=>p.l+(n<2?0:k/(n-1))*(W-p.l-p.r),Y=v=>H-p.b-(v-mn)/(mx-mn)*(H-p.t-p.b),fm=cfg.yfmt||fmtK;
  const st=niceStep((mx-mn)/4);let g='';for(let v=Math.ceil(mn/st)*st;v<=mx;v+=st)g+=`<line class="grid" x1="${p.l}" x2="${W-p.r}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax" x="${p.l-6}" y="${Y(v)+4}" text-anchor="end">${fm(v)}</text>`;
  const ev=Math.max(1,Math.ceil(n/8));const xl=L.map((t,k)=>k%ev===0||k===n-1?`<text class="ax" x="${X(k)}" y="${H-8}" text-anchor="middle">${esc(t)}</text>`:'').join('');
  const body=ser.slice().reverse().map(s=>{const pts=s.v.map((v,k)=>`${X(k).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');return (s.fill?`<polygon points="${X(0)},${Y(mn)} ${pts} ${X(n-1)},${Y(mn)}" fill="${s.color}" opacity=".18"/>`:'')+`<polyline class="ln" points="${pts}" stroke="${s.color}" ${s.dash?'stroke-dasharray="5 4"':''}/>`;}).join('');
  return `<div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" class="viz" role="img" aria-label="${esc(cfg.aria||'Chart')}">${g}${body}${xl}</svg><div class="legend">${cfg.series.map(s=>`<span class="lg"><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div></div>`;}

  $$('#tabs [data-tab]').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;save();render();scrollTo(0,0);});
  renderFileBar();const an=S.appName||'Retirement Plan v2';$('#appName').textContent=an;document.title=an;

document.addEventListener('DOMContentLoaded',()=>{load();render();});

     how:'You create a fund at a school (college foundation) or at a community foundation. A committee picks students using your criteria (for example: nursing students, or children of service members, from a certain county). You usually cannot pick the winner yourself, which keeps the tax deduction.',
     cost:'<b>Annual (pass-through):</b> you give the award money each year, often $1,000 to $5,000; no big minimum. <b>Endowed:</b> one fund that lasts forever. Examples: University of Minnesota $50,000 minimum; many community foundations $25,000 (Northwest Minnesota Foundation; Saint Paul & Minnesota Foundation designated education funds). Many let you build to the minimum over about 5 years.',
     tax:'Deductible as a gift to a public charity (same rules as direct gifts or a DAF). <b>How payout works:</b> an endowment spends a set percent each year, often 4% to 5% (UMN uses 4.5%). The rest of the return stays in the fund so the award can grow with inflation. $50,000 at 4.5% gives about $2,250 a year.',
     pros:['Lasting, personal legacy (can carry your name or honor someone)','Directly grows the nursing or military-family pipeline'],
     cons:['Endowed funds need a lot of money for a modest award','You give up control over who is chosen','Pass-through stops when you stop giving'],
     ex:'The Phyllis A. McClenathan Nursing Scholarship at the Winona Health Foundation: a husband created an endowment in memory of his wife, a registered nurse. It pays a $1,000 scholarship each year to a nursing student entering the final year.'},
    {k:'money', icon:'📜', t:'Trusts, wills and beneficiary forms', tag:'Give later, sometimes with income now.',
     how:`<ul class="small">
       <li><b>Charitable remainder trust (CRT):</b> you move assets in; the trust pays you (or others) income for life or up to 20 years (5% to 50% a year); at least 10% of the starting value must be left for charity at the end.</li>
       <li><b>Charitable lead trust (CLT):</b> the reverse. Charity gets payments for a set time, then what is left goes to your family. Mostly used to cut gift or estate tax on large estates.</li>
       <li><b>Will or revocable living trust bequest:</b> one sentence leaves a dollar amount, a percent, or what is left to a charity. You keep full control while alive.</li>
       <li><b>Beneficiary designation:</b> name a charity on an IRA, TSP, life insurance or bank account (payable on death). Retirement money is often the best asset to leave to charity because a charity pays no income tax on it, while your heirs would.</li></ul>`,
     cost:'Beneficiary form: free. Will or trust update: often a few hundred to a few thousand dollars with an attorney. CRT or CLT: legal and admin costs usually make them worth it only for six figures and up (often $250,000+, commonly cited, varies).',
     tax:'CRT/CLT: partial income-tax deduction now, based on IRS tables. A CRT can sell appreciated property without paying capital gains up front. Bequests are fully deductible for estate tax. 2026 estate tax: federal exemption $15 million per person; <b>Minnesota estate tax starts at $3 million</b>, so a farm share plus other assets could matter. Charitable gifts lower a taxable estate.',
     pros:['Bequests and beneficiary forms cost nothing now and can be changed','CRT gives lifetime income plus a gift'],
     cons:['CRT and CLT are irrevocable and complex','Rules depend on the farm trust and family; get professional help'],
     ex:'Example language: "I give 10% of my residuary estate to [charity name, EIN]." Using a percent keeps the gift in balance if your wealth changes.',
     extra:'<div class="warnbox small">Trusts are legal documents. Talk to a Minnesota estate planning attorney and a fee-only (fiduciary) financial advisor before setting one up. Do not change anything about the family farm trust without the trustee and your siblings.</div>'},
    {k:'money', icon:'🏛️', t:'Starting a nonprofit (501(c)(3))', tag:'Biggest workload. Consider the alternatives first.',
     how:`<ol class="small">
       <li>Choose a name and a board (Minnesota needs at least 3 directors under Minn. Stat. 317A).</li>
       <li>File Articles of Incorporation with the Minnesota Secretary of State ($70 by mail, $90 online).</li>
       <li>Get an EIN from the IRS (free) and write bylaws and a conflict of interest policy.</li>
       <li>Apply for 501(c)(3) status: Form 1023-EZ ($275) if you expect under $50,000 a year in revenue and under $250,000 in assets, otherwise Form 1023 ($600).</li>
       <li>Register with the Minnesota Attorney General ($25) once you raise over $25,000 a year or use paid fundraisers.</li>
       <li>Every year: Secretary of State renewal by Dec 31 (free), IRS Form 990/990-EZ/990-N, and the Attorney General annual report ($25, due July 15 for a calendar year). Audit required above $750,000 revenue.</li></ol>`,
     cost:'About $400 to $1,000 in fees to start, plus your time. Many people pay a lawyer or accountant $1,000 to $5,000. Ongoing: bookkeeping, insurance, board meetings, filings, fundraising. Plan on many hours a month.',
     tax:'Donors to your 501(c)(3) can deduct gifts. You, as founder, can deduct your own cash gifts, but not the value of your time.',
     pros:['Full control of a mission you care about','Can apply for grants'],
     cons:['Ongoing work for years; many small nonprofits close within a few years','It is not yours: it belongs to the public and is run by a board'],
     ex:'Team Rubicon was started in 2010 by two Marine veterans after the Haiti earthquake and now has thousands of veteran volunteers. It started small.',
     extra:'<div class="goodbox small"><b>Easier alternatives:</b> <b>Fiscal sponsorship</b> (an existing nonprofit holds your project and does the paperwork for a fee, often 5% to 10%) or a <b>named fund at a community foundation</b> (they handle the legal side). You can test an idea this way before forming a nonprofit.</div>'},
    {k:'money', icon:'🏰', t:'Private foundation', tag:'For large, multi-generation giving.',
     how:'A separate legal charity that you and your family control. It invests its money and makes grants. It can hire family (at fair pay) and run for generations.',
     cost:'Advisors often suggest $1 million or more because of legal, accounting and filing costs (several thousand dollars a year). Must pay out at least 5% of assets each year.',
     tax:'1.39% excise tax on net investment income (a proposed increase was dropped from the final 2025 tax law). Donor deduction limits are lower: cash up to 30% of AGI, stock up to 20%. Files Form 990-PF, which is public. Strict "self-dealing" rules.',
     pros:['Most control','Family legacy and a place to involve children'],
     cons:['Most cost and rules','Public filings show assets and grants','A DAF does most of the same for far less'],
     ex:'The Bush Foundation in Saint Paul was started in 1953 by 3M executive Archibald Bush and his wife Edyth and still makes grants across Minnesota and the Dakotas.'},
    {k:'money', icon:'🌾', t:'Land and the farm', tag:'Ideas only. Every family and trust is different.',
     how:`<ul class="small">
       <li><b>Conservation easement:</b> the owner keeps the land (and can keep farming it) but gives up the right to develop it, forever. A land trust such as the ${a('https://mnland.org','Minnesota Land Trust')} holds the easement.</li>
       <li><b>Donate land</b> (or a share) to a land trust, college, or church. Some charities also accept land in a will.</li>
       <li><b>Farm-to-community:</b> rent a few acres to beginning farmers or a community garden, donate crops to food shelves, host farm visits for schools or veterans' farming programs.</li></ul>`,
     cost:'Easements need an appraisal, survey, baseline study and legal work, often several thousand dollars, and many land trusts ask for a stewardship gift. Some public programs buy easements instead.',
     tax:'A donated easement is a charitable gift equal to the lost value. Deduction up to 50% of AGI (100% for qualified farmers and ranchers), with 15 years to use any carryover. Can also lower estate value. The IRS watches easement deals closely, so use a qualified appraiser.',
     pros:['Keeps the land as farmland for good','Can lower estate tax for the next generation'],
     cons:['Permanent; it binds every future owner','All owners or trustees must agree','Can lower the land\'s sale value'],
     ex:'Bob and Michelle Scanlan put a conservation easement on 98 acres of their family farm in Houston County with the Minnesota Land Trust. It keeps the farm in the family for cattle grazing and protects Wildcat Creek.'},
    {k:'duty', icon:'🎖️', t:'Giving time: veteran skills', tag:'Free, and often the most needed gift.',
     how:`<ul class="small">
       <li>${a('https://teamrubiconusa.org','Team Rubicon')}: veteran-led disaster response (cleanup, repairs, planning).</li>
       <li>${a('https://www.volunteer.va.gov','VA Voluntary Service')} at the Minneapolis VA or a clinic: drivers, escorts, honor guards, events.</li>
       <li>Mentor newer veterans or JROTC/ROTC cadets; be an Honor Flight guardian; serve on a veterans nonprofit board.</li></ul>`,
     cost:'Free, apart from time and mileage. Some roles need a background check or short training.',
     tax:'Time is not deductible. Unpaid out-of-pocket costs while volunteering for a charity can be (for example, 14 cents a mile for charity driving, set by law), if you itemize.',
     pros:['Uses leadership and logistics skills you already have','Connection with other veterans'],
     cons:['Disaster deployments can take days away','Pick one or two places to avoid burnout'],
     ex:'In July 2026 about 30 Team Rubicon volunteers cleared debris and made repairs for free in Detroit Lakes, Minnesota, after an EF-2 tornado.'},
    {k:'study', icon:'🩺', t:'Giving time: nursing skills', tag:'Your future license is a gift too.',
     how:`<ul class="small">
       <li>Free and community clinics (check with the Minnesota Association of Community Health Centers or local free clinics).</li>
       <li>${a('https://www.health.state.mn.us/communities/ep/mnresponds/','MN Responds Medical Reserve Corps')}: health volunteers for emergencies and vaccine clinics.</li>
       <li>Red Cross shelter or blood-drive nursing; blood-pressure and flu-shot events.</li>
       <li>Mentor or tutor nursing students once you are licensed, or guest-speak at a nursing program.</li></ul>`,
     cost:'Free. Keep your license active; some roles need an orientation. Check that the group carries volunteer liability coverage.',
     tax:'Time is not deductible. Unreimbursed supplies and mileage for a charity can be, if you itemize.',
     pros:['Keeps clinical skills sharp and builds your network','Fills real gaps in rural and low-income care'],
     cons:['Hard to fit in while in school and working shifts','Some volunteer roles need an active license first'],
     ex:'Minnesota Medical Reserve Corps units (MN Responds) call on nurse volunteers to staff emergency shelters and vaccination clinics.'}
  ];
  function list(arr){ return `<ul class="small">${arr.map(x=>`<li>${x}</li>`).join('')}</ul>`; }
  function card(c){
    return `<div class="panel ${c.k}">
      <div class="eyebrow-s">${c.icon} ${c.tag}</div>
      <h3>${c.t}</h3>
      <div class="small"><b>How it works.</b> ${c.how}</div>
      <div class="small"><b>Minimum and cost.</b> ${c.cost}</div>
      <div class="small"><b>Taxes (2026).</b> ${c.tax}</div>
      <details><summary>Pros, cons and a real example</summary>
        <div class="grid2"><div><div class="eyebrow-s pos">Pros</div>${list(c.pros)}</div>
        <div><div class="eyebrow-s neg">Cons</div>${list(c.cons)}</div></div>
        <div class="small"><b>Example.</b> ${c.ex}</div>
      </details>
      ${c.extra||''}
    </div>`;
  }

  // ---------- Endowment model ----------
  function model(g){
    const p=Math.max(0.1,g.payout)/100, r=g.ret/100, i=g.infl/100;
    const need=g.award/p;                     // today's dollars
    // Build phase: month by month until the fund reaches the inflation-grown target.
    let bal=g.lump, m=0;
    const rm=Math.pow(1+r,1/12)-1;
    const target=mm=>need*Math.pow(1+i,mm/12);
    if(bal<target(0)){
      if(g.monthly<=0 && (rm<=0 || bal<=0)) m=Infinity;
      else { while(bal<target(m) && m<600){ bal=bal*(1+rm)+g.monthly; m++; } if(m>=600) m=Infinity; }
    }
    const yrs=m/12;
    // 30-year path: contribute until target reached, then pay out each year.
    const labels=[], balS=[], paidS=[], gaveS=[]; let b=g.lump, paid=0, gave=g.lump, firstAward=null, lastAward=0;
    for(let y=0;y<=30;y++){
      labels.push(y===0?'Now':'Yr '+y);
      balS.push(Math.round(b)); paidS.push(Math.round(paid)); gaveS.push(Math.round(gave));
      if(y===30) break;
      const building = !(isFinite(yrs) && y>=Math.ceil(yrs));
      if(building){ for(let k=0;k<12;k++){ b=b*(1+rm)+g.monthly; gave+=g.monthly; } }
      else { const aw=b*p; if(firstAward===null) firstAward={y, aw}; lastAward=aw; paid+=aw; b=(b-aw)*(1+r); }
    }
    const realLast = lastAward/Math.pow(1+i,30);
    return {need, yrs, labels, balS, paidS, gaveS, firstAward, lastAward, realLast, paid, gave, real:(r-p-i)};
  }
  function modelHTML(){
    const g=st(), o=model(g);
    const yrsTxt = o.yrs===0 ? 'Already there' : isFinite(o.yrs) ? (o.yrs<1?'Under 1 year':o.yrs.toFixed(1)+' years') : 'Not reached in 50 yrs';
    const chart=lineChart({labels:o.labels, yfmt:fmtK, height:260, series:[
      {name:'Fund balance', values:o.balS, color:'var(--accent)', fill:true},
      {name:'Total scholarships paid', values:o.paidS, color:'var(--study)'},
      {name:'Total you put in', values:o.gaveS, color:'var(--s3)', dash:true}]});
    return `<div class="tiles">
      <div class="tile"><div class="eyebrow-s">Endowment needed (today's $)</div><div class="tbig">${money0(o.need)}</div><div class="small muted">${money0(g.award)} a year at ${pct1(g.payout/100)} payout</div></div>
      <div class="tile"><div class="eyebrow-s">Time to build it</div><div class="tbig">${yrsTxt}</div><div class="small muted">${money0(g.monthly)}/mo + ${money0(g.lump)} lump, target grows with inflation</div></div>
      <div class="tile"><div class="eyebrow-s">Scholarships paid by year 30</div><div class="tbig">${money0(o.paid)}</div><div class="small muted">you put in ${money0(o.gave)}${o.firstAward?`; first award about ${money0(o.firstAward.aw)} in year ${o.firstAward.y+1}`:''}</div></div>
      <div class="tile"><div class="eyebrow-s">Year-30 award in today's $</div><div class="tbig">${o.lastAward?money0(o.realLast):'n/a'}</div><div class="small muted">${o.lastAward?money0(o.lastAward)+' in future dollars':'fund still building'}</div></div>
    </div>
    ${chart}
    ${o.real<0?`<div class="warnbox small">Return minus payout (${pct1((g.ret-g.payout)/100)}) is below inflation (${pct1(g.infl/100)}), so the award will slowly lose buying power. That is why many endowments pay 4% to 5%.</div>`:`<div class="goodbox small">Return minus payout covers inflation, so the award should keep its buying power on average. Real markets go up and down.</div>`}
    <div class="small muted">Pass-through instead: giving ${money0(g.award)} a year directly helps a student right away and costs ${money0(g.award*30)} over 30 years, but stops when you stop.</div>`;
  }

  // ---------- DAF vs cash example ----------
  function dafHTML(){
    const g=st(), v=Math.max(0,g.stock), basis=Math.min(Math.max(0,g.basis),v), gain=v-basis;
    const cgTax=gain*g.cg/100, cashGift=v-cgTax;
    const A={charity:cashGift, cg:cgTax, ded:cashGift*g.bracket/100};
    const B={charity:v, cg:0, ded:v*g.bracket/100};
    A.cost=v-A.ded; B.cost=v-B.ded;
    const row=(l,x,y,f)=>`<tr><td>${l}</td><td class="num">${f(x)}</td><td class="num">${f(y)}</td></tr>`;
    return `<div class="tbl-wrap"><table class="mtbl"><thead><tr><th></th><th class="num">Sell stock, give cash</th><th class="num">Give stock (DAF or charity)</th></tr></thead><tbody>
      ${row('Capital gains tax you pay',A.cg,B.cg,money0)}
      ${row('Charity receives',A.charity,B.charity,money0)}
      ${row('Federal tax saved by deduction',A.ded,B.ded,money0)}
      ${row('Net cost to you (stock value minus tax saved)',A.cost,B.cost,money0)}
    </tbody></table></div>
    <div class="goodbox small">Giving the shares directly: the charity gets <b>${money0(B.charity-A.charity)}</b> more and you save <b>${money0(B.ded-A.ded)}</b> more in tax.</div>`;
  }

  // ---------- Checklist ----------
  const STEPS=[
    ['monthly','Set up one small monthly gift to a charity you already trust (check it on Charity Navigator or Smart Givers).','Easiest'],
    ['time','Pick one volunteer role: VA Voluntary Service, Team Rubicon, a free clinic or MN Responds.','Easy'],
    ['benef','Name a charity as a partial beneficiary on an IRA, life insurance or bank account (payable on death).','Easy, free'],
    ['will','Write or update a will (and health care directive) and include a charity, even a small percent.','Some effort'],
    ['daf','Open a donor-advised fund, especially in a year with a big bonus or a stock gain.','Some effort'],
    ['schol','Start a pass-through scholarship, or a named fund at a community foundation you build over 5 years.','More effort'],
    ['farm','With family and the trustee, learn about farm conservation and legacy options. Meet an estate attorney.','More effort'],
    ['npo','Start a project under fiscal sponsorship, and only then consider your own nonprofit.','Most effort']];
  function checklistHTML(){
    const d=st().done; const n=STEPS.filter(s=>d[s[0]]).length;
    return `<div class="small muted" id="gv-count">${n} of ${STEPS.length} done</div>
    <div class="pl-list">${STEPS.map((s,ix)=>`<label class="pl-row"><span><input type="checkbox" data-gv-step="${s[0]}" ${d[s[0]]?'checked':''}> ${ix+1}. ${s[1]}</span><span class="amt small muted">${s[2]}</span></label>`).join('')}</div>`;
  }

  function field(k,label,step,min){
    const g=st();
    return `<label class="f">${label}<input type="number" inputmode="decimal" step="${step}" min="${min==null?0:min}" data-gv="${k}" value="${esc(String(g[k]))}"></label>`;
  }

  function view(){
    st();
    return `<div class="stack">
      <div class="panel money">
        <div class="eyebrow-s">🟨 Giving</div>
        <h2>Using what you have for good</h2>
        <p class="small">You do not need to be rich to be generous. People give three things: <b>time</b>, <b>talent</b> (skills like nursing or leadership), and <b>treasure</b> (money and property). A $10 monthly gift, an afternoon at a free clinic, or one line in a will all count. Start small, learn what you care about, and grow your giving as your income and assets grow. The tools below go roughly from simplest to most complex.</p>
        <div class="small muted">Educational only, not tax or legal advice. Rules shown are for 2026 and can change. For trusts, land or large gifts, talk with a fee-only (fiduciary) financial advisor, a CPA, and a Minnesota estate attorney.</div>
      </div>

      <h3>Ways to give</h3>
      <div class="grid2">${CARDS.map(card).join('')}</div>

      <div class="panel study">
        <div class="eyebrow-s">🟦 Model</div>
        <h3>Scholarship / endowment calculator</h3>
        <p class="small">How big a fund pays a yearly scholarship forever, and how long to build it. Example numbers; change them.</p>
        <div class="fields">
          ${field('award','Yearly scholarship ($)',100)}
          ${field('payout','Payout rate (%)',0.1,0.1)}
          ${field('ret','Expected return (%/yr)',0.1,-10)}
          ${field('infl','Inflation (%/yr)',0.1,0)}
          ${field('monthly','You add per month ($)',25)}
          ${field('lump','Lump sum now ($)',500)}
        </div>
        <div id="gv-model">${modelHTML()}</div>
        <div class="small muted">Assumes steady returns, contributions until the target is reached, then a yearly payout of the payout rate times the balance. Fund fees (often 0.5% to 1.5%) are not included; lower the return to account for them.</div>
      </div>

      <div class="panel money">
        <div class="eyebrow-s">🟨 Example only (made-up numbers)</div>
        <h3>DAF with stock vs giving cash</h3>
        <p class="small">Say you own shares worth more than you paid, held over one year, and you itemize (and already clear the 0.5% floor). Compare selling them and donating the cash with giving the shares themselves.</p>
        <div class="fields">
          ${field('stock','Stock value today ($)',500)}
          ${field('basis','What you paid (cost basis $)',500)}
          ${field('bracket','Federal tax bracket (%)',1)}
          ${field('cg','Capital gains rate (%)',1)}
        </div>
        <div id="gv-daf">${dafHTML()}</div>
        <div class="small muted">Federal only. Minnesota taxes capital gains as ordinary income, so the state savings from giving shares would add to this. If you take the standard deduction, a DAF gives no deduction; only cash gifts straight to charities count for the new $1,000/$2,000 deduction.</div>
      </div>

      <div class="panel money">
        <div class="eyebrow-s">🟨 Where to start</div>
        <h3>Checklist, easiest first</h3>
        ${checklistHTML()}
      </div>

      <div class="small muted">Sources (2026): CPA Practice Advisor, Community Foundation of Greater Des Moines, BerryDunn (2025 tax law); FedSmith (QCD and TSP); MN Dept. of Revenue; Daffy DAF comparison, Minneapolis Foundation, Saint Paul &amp; Minnesota Foundation; University of Minnesota Foundation, Northwest Minnesota Foundation, Winona Health Foundation; Cornell LII (CRTs); Minnesota Council of Nonprofits, Harbor Compliance, MJCPA (nonprofit filings); Honkamp, Minnesota Land Trust (easements); Farrish Law (estate tax); Charities Review Council; Valley News Live (Team Rubicon).</div>
    </div>`;
  }

  function bind(){
    $$('[data-gv]').forEach(el=>{
      el.addEventListener('input',()=>{
        const g=st(), k=el.dataset.gv; g[k]=num(el.value,g[k]);
        save();
        const m=$('#gv-model'); if(m) m.innerHTML=modelHTML();
        const d=$('#gv-daf'); if(d) d.innerHTML=dafHTML();
      });
    });
    $$('[data-gv-step]').forEach(el=>{
      el.addEventListener('change',()=>{
        const d=st().done; d[el.dataset.gvStep]=el.checked; save();
        const c=$('#gv-count'); if(c) c.textContent=`${STEPS.filter(s=>d[s[0]]).length} of ${STEPS.length} done`;
      });
    });
  }

  TABS2.push({id:'giving', name:'Giving', order:90, view, bind});
})();

</script>
