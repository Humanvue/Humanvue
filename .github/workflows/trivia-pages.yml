# Publishes the trivia/ folder to GitHub Pages on every push.
# One-time setup: Settings > Pages > Source: GitHub Actions.
name: Deploy Squad Trivia

on:
  push:
    branches: [main, claude/project-thread-vingpb]
    paths: ['trivia/**', '.github/workflows/trivia-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: trivia
      - id: deployment
        uses: actions/deploy-pages@v4
